function crisisMonth() {
  const dp = diffP();
  // avance y caducidad
  for (let i = G.crises.length - 1; i >= 0; i--) {
    const cr = G.crises[i]; cr.left--;
    const t = CRISIS_TYPES[cr.type];
    if (cr.scope !== 'global') {
      const c = G.C[cr.scope];
      if (t.legit) c.legitimacy = Math.max(0, c.legitimacy + t.legit * (cr.type === 'aid' ? 0 : 1));
      if (t.rad) c.radicals = Math.min(0.9, c.radicals + t.rad);
      if (t.pop) c.states.forEach(id => { const s = G.S[id]; for (const p in s.pops) s.pops[p] *= (1 - t.pop); });
    } else {
      G.tags.forEach(tag => { if (tag !== NONE) G.C[tag].legitimacy -= 0.12; });
    }
    if (cr.left <= 0) {
      G.crises.splice(i, 1);
      if (cr.type === 'panic') G.afterPanic = G.date.t;
      if (cr.scope === 'global' || cr.scope === G.player) { if (cr.type !== 'aid') { notify('crisis', `Termina: ${cr.name}.`); cnt(G.C[G.player], 'crisesEnded'); } }
    }
  }
  // crisis globales aleatorias
  const stress = 1 + Math.max(0, -G.cycle) * 1.2;
  if (Math.random() < 0.05 * dp.crisis * stress && G.crises.filter(c => c.scope === 'global').length < 2) {
    const yr = G.date.y;
    const ok = Object.keys(CRISIS_TYPES).filter(id => {
      const t = CRISIS_TYPES[id]; if (t.scope !== 'global' || !t.w) return false;
      if (G.crises.some(c => c.type === id)) return false;
      if (t.needs === 'afterPanic') return G.afterPanic && G.date.t - G.afterPanic < 365 * 2;
      if (t.needs === 'railways') return G.C[G.rankList[0]].techs.has('railways') || yr > 1850;
      return true;
    });
    if (ok.length) {
      let tot = 0; ok.forEach(id => tot += CRISIS_TYPES[id].w * (id === 'panic' && G.cycle > 0.5 ? 2 : 1));
      let r = Math.random() * tot, chosen = ok[0];
      for (const id of ok) { r -= CRISIS_TYPES[id].w * (id === 'panic' && G.cycle > 0.5 ? 2 : 1); if (r <= 0) { chosen = id; break; } }
      addCrisis(chosen, 'global');
    }
  }
  // hambruna histórica de la patata (1845-1847)
  if (G.date.y === 1845 && G.date.m === 8 && !G.potato) { G.potato = true; ['GBR', 'NET', 'BEL', 'PRU'].forEach(t => { if (G.C[t] && G.C[t].states.length) addCrisis('local_famine', t, {months: 22, left: 22, name: 'Gran Hambruna de la patata'}); }); }
  // crisis nacionales
  G.tags.forEach(t => {
    if (t === NONE) return; const c = G.C[t]; if (!c.states.length) return;
    const income = Math.max(1, c.stats.income);
    const ratio = c.debt / income;
    // contador de legitimidad baja
    c.lowLeg = c.legitimacy < 32 ? (c.lowLeg || 0) + 1 : Math.max(0, (c.lowLeg || 0) - 1);
    if (ratio > 26 * (c.mods.crisis ? 1 + c.mods.crisis : 1) && Math.random() < 0.2) addCrisis('currency', t);
    if (ratio > 70 && !G.crises.some(x => x.type === 'bankruptcy' && x.scope === t)) { addCrisis('bankruptcy', t); c.treasury = 0; c.debt = 0; c.prestige = Math.max(0, c.prestige - 15); c.investPool = 0; }
    if (c.radicals > 0.22 && c.stats.indLevels > 10 && Math.random() < 0.03 * dp.crisis) addCrisis('strike', t);
    if (c.stats.pop > 8e5 && Math.random() < 0.0014 * dp.crisis * (1 - Math.min(0.7, c.mods.grow * 80))) addCrisis('epidemic', t);
    if (c.stats.sol < 6 && Math.random() < 0.006 * dp.crisis) addCrisis('local_famine', t);
    // ciclo recesivo: la inversión de los capitalistas se evapora en las depresiones
    if (G.crises.some(x => x.type === 'depression')) c.investPool *= 0.9;
  });
}

// Respuestas del jugador a las crisis
function respondCrisis(kind) {
  const c = me(); const inc = Math.max(1, c.stats.income);
  const cost = {bailout: inc * 5, stimulus: inc * 3, austerity: 0}[kind];
  if (c.treasury < cost && kind !== 'austerity') return {ok: false, msg: 'No tienes fondos suficientes.'};
  c.treasury -= cost;
  if (kind === 'bailout') {
    G.crises.forEach(cr => { if (['panic', 'currency', 'bankruptcy', 'rail_bubble'].includes(cr.type) && (cr.scope === c.tag || cr.scope === 'global')) cr.left = Math.max(1, Math.round(cr.left * 0.7)); });
    c.investPool += inc * 3; addCrisis('aid', c.tag);
    return {ok: true, msg: 'Rescate bancario aplicado: las crisis financieras serán más cortas.'};
  }
  if (kind === 'stimulus') { addCrisis('aid', c.tag); return {ok: true, msg: 'Plan de estímulo: más demanda e inversión durante 8 meses.'}; }
  if (kind === 'austerity') { c.treasury += inc * 2; c.radicals = Math.min(0.9, c.radicals + 0.03); c.legitimacy -= 3; c.taxLevel = Math.min(4, c.taxLevel + 1); return {ok: true, msg: 'Austeridad: recaudas más, pero aumenta el malestar social.'}; }
  return {ok: false, msg: ''};
}

/* ---------- patrocinio de grupos (boosts) ---------- */
function boostMult(c, ig) { let m = 1; c.boosts.forEach(b => { if (b.kind === 'ig' && b.key === ig) m *= b.mult; }); return m; }

function sponsorIG(c, ig, mode) {
  const cost = 35, money_ = c.stats.income * 2;

  if (!c.ai && c.treasury < money_) return {ok: false, msg: 'Fondos insuficientes.'};

}
function sponsorProf(c, p, mode) {

function sponsorAbroad(c, tag, ig) {

function govName(c) {

function applyProgram(c, ig, force, maxChanges) {

}

function transitionOptions(c, ig) {

function govTransition(c, ig, kind, silent) {

      lost.forEach(id => transferState(G.S[id], NONE));

function checkRevolution(c) {

/* ---------- utilidades ---------- */
const relOf = (a, b) => (G.C[a].relations[b] ?? 0);
function addRel(a, b, v) {
  const A = G.C[a], B = G.C[b]; if (!A || !B || a === NONE || b === NONE) return;
  A.relations[b] = clamp((A.relations[b] ?? 0) + v, -100, 100);
  B.relations[a] = clamp((B.relations[a] ?? 0) + v, -100, 100);
}
function alive(tag) { return tag !== NONE && G.C[tag] && G.C[tag].states.length > 0; }
function pactsOf(tag) { return G.pacts.filter(p => p.a === tag || p.b === tag); }
function pactBetween(type, a, b) { return G.pacts.find(p => p.type === type && ((p.a === a && p.b === b) || (PACTS[type].mutual && p.a === b && p.b === a))); }
function anyPactBetween(a, b, types) { return G.pacts.find(p => types.includes(p.type) && ((p.a === a && p.b === b) || (p.a === b && p.b === a))); }
function allies(tag) { return G.pacts.filter(p => p.type === 'alliance' && (p.a === tag || p.b === tag)).map(p => p.a === tag ? p.b : p.a); }
function guaranteedBy(tag) { return G.pacts.filter(p => p.type === 'guarantee' && p.b === tag).map(p => p.a); }
function blocOf(tag) { const c = G.C[tag]; return c && c.bloc ? G.blocs.find(b => b.id === c.bloc) : null; }
function atWarWith(a, b) { return G.wars.some(w => (w.attAll.includes(a) && w.defAll.includes(b)) || (w.attAll.includes(b) && w.defAll.includes(a))); }
function inWar(tag) { return G.C[tag].wars.length > 0; }
function pactDays(p) { return (G.date.y - p.since.y) * 12 + (G.date.m - p.since.m); }
function armyPower(c) { return c.stats.soldiers * (1 + c.mods.army + blocArmyBonus(c)) * (0.8 + 0.4 * c.milFund) * (1 + c.lit / 400); }
function blocArmyBonus(c) { const b = blocOf(c.tag); return b && b.type === 'military' ? 0.05 : 0; }
function blocEconBonus(c) { const b = blocOf(c.tag); return b && b.type === 'economic' ? 0.04 : 0; }
function diploIncomeBonus(c) {
  let t = 0; G.pacts.forEach(p => { if (p.type === 'trade' && (p.a === c.tag || p.b === c.tag)) t += 0.03; });
  return Math.min(0.09, t) + blocEconBonus(c);
}
// Flujos de dinero entre países: subsidios, tributo y costes de guerra. Devuelve el gasto del país.
function pactMoneyFlows(c) {
  let out = 0; const inc = c.stats.income;
  G.pacts.forEach(p => { if (p.type === 'subsidy' && p.a === c.tag) { const amt = inc * 0.02 * (p.level || 1); out += amt; G.C[p.b].treasury += amt; } });
  if (c.overlord && G.C[c.overlord]) { const amt = inc * 0.12; out += amt; G.C[c.overlord].treasury += amt; }
  if (c.wars.length) out += inc * 0.05 * Math.min(2, c.wars.length);
  return out;
}

function stateCenterLL(s) { return stateCenter(s); }
function distBetween(a, b) { return distStates(a, b); }
function minDist(A, B) {
  let min = 1e9, border = false;
  A.states.forEach(i => B.states.forEach(j => { if (G.S[i].neigh.includes(j)) border = true; const d = distStates(G.S[i], G.S[j]); if (d < min) min = d; }));
  return {min, border};
}
function reachRange(c) { return c.rank <= 6 ? 42 : c.rank <= 14 ? 24 : 14; }
function canReach(a, b) {
  const A = G.C[a], B = G.C[b]; if (!A.states.length || !B.states.length) return false;
  const m = minDist(A, B);
  return m.border || m.min < reachRange(A);
}
// Estados del rival que se pueden reclamar en una guerra
function reachableStates(a, b) {
  const A = G.C[a], B = G.C[b]; const out = [];
  const R = reachRange(A);
  B.states.forEach(j => {
    const s = G.S[j]; let best = 1e9, border = false;
    A.states.concat(allies(a).flatMap(t => G.C[t].states)).forEach(i => { if (G.S[i].neigh.includes(j)) border = true; const d = distStates(G.S[i], s); if (d < best) best = d; });
    if (border || (MAP.stats[j].coast > 20 && best < R)) out.push({id: j, d: best, border});
  });
  return out.sort((x, y) => (y.border - x.border) || x.d - y.d);
}
function stateWeight(sid) { return 1 + G.S[sid].popBase / 6000; }
function claimedStates(c, victim) { return reachableStates(c.tag, victim).filter(x => c.claims.some(cl => cl.state === x.id)); }
function hasClaim(c, sid) { return c.claims.some(cl => cl.state === sid); }

/* ---------- opciones de guerra ---------- */
function cbAvailable(attTag, defTag, cbId) {
  const A = G.C[attTag], D = G.C[defTag], cb = CBS[cbId];
  if (cb.hidden) return {ok: false, why: 'Solo defensiva'};
  if (cb.need && !cb.need(A, D)) return {ok: false, why: 'No cumples los requisitos'};
  if (cbId === 'claim' && !claimedStates(A, defTag).length) return {ok: false, why: 'No tienes reclamaciones alcanzables sobre este país'};
  if (cb.terr && !reachableStates(attTag, defTag).length) return {ok: false, why: 'Sin territorios alcanzables'};
  return {ok: true};
}
function warCost(attTag, targets, cbId) {
  const cb = CBS[cbId]; let c = cb.cost;
  (targets || []).forEach(sid => c += cb.perState * stateWeight(sid));
  return Math.round(c);
}
function warBlockers(attTag, defTag) {
  const A = G.C[attTag], D = G.C[defTag];
  if (!D || !D.states.length || defTag === NONE) return 'Objetivo no válido';
  if (attTag === defTag) return 'No puedes atacarte a ti mismo';
  if (atWarWith(attTag, defTag)) return 'Ya estáis en guerra';
  if (A.overlord) return 'Un vasallo no puede declarar guerras';
  if (A.overlord === defTag || D.overlord === attTag) return 'Es tu vasallo/soberano';
  if (pactBetween('alliance', attTag, defTag)) return 'Es tu aliado. Rompe la alianza primero';
  if (pactBetween('nonagg', attTag, defTag)) return 'Pacto de no agresión vigente';
  if (A.bloc && A.bloc === D.bloc) return 'Pertenecéis al mismo bloque';
  if (!canReach(attTag, defTag)) return 'No hay un frente alcanzable';
  return null;
}

function declareWar(attTag, defTag, cbId, targets, opts) {
  opts = opts || {}; cbId = cbId || 'humiliate'; targets = (targets || []).slice();
  const A = G.C[attTag], D = G.C[defTag], cb = CBS[cbId];
  const block = warBlockers(attTag, defTag); if (block) return {ok: false, msg: block};
  const av = cbAvailable(attTag, defTag, cbId); if (!av.ok && !opts.free) return {ok: false, msg: av.why};
  if (cb.terr) {
    const valid = new Set(reachableStates(attTag, defTag).map(x => x.id));
    targets = targets.filter(t => valid.has(t) && (cbId !== 'claim' || hasClaim(A, t)));
    if (!targets.length) return {ok: false, msg: 'Elige al menos un territorio válido.'};
    if (targets.length > cb.max(A)) targets = targets.slice(0, cb.max(A));
  }
  const cost = opts.free ? 0 : warCost(attTag, targets, cbId);
  if (!opts.free && !A.ai && A.influence < cost) return {ok: false, msg: `Necesitas ${cost} de influencia.`};
  if (!A.ai && !opts.free) A.influence -= cost;
  else if (!opts.free) A.influence = Math.max(0, A.influence - cost * 0.5);
  if (cbId === 'regime' && !opts.law) opts.law = {cat: 'agrarian', opt: 'tenant'};
  const w = {id: G.nextWarId++, att: attTag, def: defTag, cb: cbId, targets, cTargets: [], score: 0, weeks: 0, attAll: [attTag], defAll: [defTag], law: opts.law || null,
    name: `${cb.name}: ${A.name} contra ${D.name}`, pa: 0, pd: 0, start: Object.assign({}, G.date)};
  // contra-objetivos del defensor: estados fronterizos del atacante
  if (cb.terr || cbId === 'vassal') {
    const back = reachableStates(defTag, attTag).slice(0, Math.max(1, targets.length)); w.cTargets = back.map(x => x.id);
  }
  G.wars.push(w);
  A.wars.push(w.id); D.wars.push(w.id);
  A.infamy += cb.infamy * (1 + targets.length * 0.3);
  addRel(attTag, defTag, -100);
  recruitSides(w);
  prepareFronts(w);
  recalcHostile();
  [w.att, w.def].concat(w.attAll, w.defAll).forEach(t => { if (G.C[t].ai) { for (let k = 0; k < 2; k++) aiRecruitCountry(t); } });
  const base = `¡${A.name} declara la guerra a ${D.name}! (${cb.name})`;
  notify('war', base, targets[0] ?? G.C[defTag].capital);
  return {ok: true, war: w};
}

function recruitSides(w) {
  const A = G.C[w.att], D = G.C[w.def];
  const tryJoin = (tag, side, p) => {
    if (!alive(tag) || w.attAll.includes(tag) || w.defAll.includes(tag)) return;
    if (G.C[tag].wars.length >= 2) return;
    if (side === 'att' && w.defAll.some(x => anyPactBetween(tag, x, ['alliance', 'nonagg']))) return;
    if (side === 'def' && w.attAll.some(x => anyPactBetween(tag, x, ['alliance']))) return;
    const C = G.C[tag];
    if (Math.random() < p || (!C.ai)) {
      (side === 'att' ? w.attAll : w.defAll).push(tag); C.wars.push(w.id);
      if (tag === G.player) notify('war', `Tu país entra en la guerra del lado de ${side === 'att' ? A.name : D.name}.`);
      else logMsg(`${C.name} se une a la guerra del lado de ${side === 'att' ? A.name : D.name}.`);
    }
  };
  const callers = (lead, side) => {
    allies(lead).forEach(t => tryJoin(t, side, side === 'def' ? 0.88 : 0.7 + relOf(lead, t) / 300));
    const b = blocOf(lead);
    if (b && b.type === 'military') b.members.forEach(t => t !== lead && tryJoin(t, side, 0.75));
    if (b && b.type === 'military' && b.leader === lead) {}
    if (side === 'def') guaranteedBy(lead).forEach(t => tryJoin(t, 'def', 0.7));
    G.C[lead].subjects?.forEach(t => tryJoin(t, side, 1));
  };
  callers(w.att, 'att'); callers(w.def, 'def');
  // el líder de un bloque militar es arrastrado por sus miembros
  [[w.att, 'att'], [w.def, 'def']].forEach(([lead, side]) => { const b = blocOf(lead); if (b && b.type === 'military' && b.leader !== lead) tryJoin(b.leader, side, 0.8); });
}

/* ---------- frentes y ocupación ---------- */
function prepareFronts(w) {
  const sideTags = (list) => new Set(list);
  void sideTags;
}
function setOcc(sid, frac, by, changed) {
  const s = G.S[sid]; if (!s) return;
  const f = Math.round(frac * 100) / 100;
  if ((s.occ || 0) !== f || s.occBy !== by) { s.occ = f; s.occBy = f > 0 ? by : null; changed.add(sid); }
}
function clearOccupation(w) { clearOccupationKeep(w); }
function sidePower(list, def) {
  let p = 0, lg = 0, df = 0;
  list.forEach(t => { const c = G.C[t]; p += armyPower(c); lg += c.mods.logistics; df += c.mods.defense; });
  const n = Math.max(1, list.length);
  return {p, lg: lg / n, df: df / n};
}
// Avance semanal de las guerras: la puntuación sale de los ejércitos reales (ocupación y batallas)
function warWeek() {
  for (let i = G.wars.length - 1; i >= 0; i--) {
    const w = G.wars[i];
    w.pa = sideStrength(w.attAll); w.pd = sideStrength(w.defAll);
    w.score = computeWarScore(w);
    w.weeks++;
    w.attAll.concat(w.defAll).forEach(t => { const c = G.C[t]; c.radicals = Math.min(0.9, c.radicals + 0.0012); });
    const humans = [w.att, w.def].some(t => !G.C[t].ai);
    const dead = !alive(w.att) || !alive(w.def);
    if (dead) { endWar(w, alive(w.att) ? w.att : w.def); continue; }
    if (Math.abs(w.score) >= 100 && !humans) endWar(w, w.score > 0 ? w.att : w.def);
    else if (!humans && w.weeks > 30 && Math.abs(w.score) > 45) endWar(w, w.score > 0 ? w.att : w.def);
    else if (!humans && w.weeks > 70 && Math.abs(w.score) < 25) endWar(w, null);
    else if (!humans && w.weeks > 110) endWar(w, null);
    else if (humans && w.weeks > 150 && Math.abs(w.score) < 25) endWar(w, null);
  }

}

/* ---------- paz y resultado ---------- */
function peaceOptions(w, tag) {
  const att = w.attAll.includes(tag); const sc = att ? w.score : -w.score;
  return {sc, label: sc > 30 ? 'Imponer la paz' : sc < -30 ? 'Pedir la paz' : 'Paz blanca'};
}
function makePeace(w) {
  const player = G.player; const mine = w.attAll.includes(player);
  const sc = mine ? w.score : -w.score;
  if (sc > 30) endWar(w, mine ? w.att : w.def);
  else if (sc < -30) endWar(w, mine ? w.def : w.att);
  else if (Math.random() < 0.55 + Math.abs(sc) / 200 || w.weeks > 40) endWar(w, null);
  else toast('🕊️', 'El enemigo rechaza la paz blanca. Insiste más adelante.');
}
function endWar(w, winner) {
  const idx = G.wars.indexOf(w); if (idx >= 0) G.wars.splice(idx, 1);
  clearOccupationKeep(w);
  w.attAll.concat(w.defAll).forEach(t => { const c = G.C[t]; c.wars = c.wars.filter(x => x !== w.id); });
  const A = G.C[w.att], D = G.C[w.def];
  if (winner === null) {
    notify('war', `${A.name} y ${D.name} firman una paz blanca.`);
    addRel(w.att, w.def, 25); return;
  }
  const attWins = winner === w.att;
  const cb = CBS[w.cb];
  const occ = {};
  if (attWins) {
    const full = Math.abs(w.score) >= 85;
    let gained = [];
    if (cb.terr) {
      w.targets.forEach(sid => { const s = G.S[sid]; if (s && s.owner === w.def && (full || (s.occ || 0) >= 0.5 || w.score >= 60)) { transferState(s, w.att); gained.push(s.name); } });
      A.prestige += 6 + gained.length * 4; cnt(A, 'statesGained', gained.length);
    } else if (w.cb === 'humiliate') {
      const ind = Math.min(Math.max(0, D.treasury), D.stats.income * 8); D.treasury -= ind; A.treasury += ind;
      A.prestige += 12; D.prestige = Math.max(0, D.prestige - 12);
    } else if (w.cb === 'regime' && w.law) {
      D.laws[w.law.cat] = w.law.opt; recalcMods(D); D.legitimacy -= 12; D.radicals = Math.min(0.9, D.radicals + 0.08); A.prestige += 8;
    } else if (w.cb === 'trade') {
      const ind = Math.min(Math.max(0, D.treasury), D.stats.income * 5); D.treasury -= ind; A.treasury += ind;
      D.tradeLoss = Math.min(0.25, (D.tradeLoss || 0) + 0.06); makePact('trade', w.att, w.def, {forced: true}); A.prestige += 8;
    } else if (w.cb === 'vassal') {
      makeSubject(w.att, w.def); A.prestige += 15; cnt(A, 'vassalsMade');
    }
    D.prestige = Math.max(0, D.prestige - 8); D.legitimacy -= 4; cnt(A, 'warsWon'); if (w.cb === 'humiliate') cnt(A, 'humiliations');
    notify('war', `${A.name} ha vencido a ${D.name}${gained.length ? ' y se anexiona ' + gained.join(', ') : ' (' + cb.name + ')'}.`, w.targets[0]);
    // aliados del vencedor ganan prestigio
    w.attAll.forEach(t => { if (t !== w.att) G.C[t].prestige += 3; });
    addRel(w.att, w.def, 20);
  } else {
    const ind = Math.min(Math.max(0, A.treasury), A.stats.income * 4); A.treasury -= ind; D.treasury += ind;
    D.prestige += 8; A.prestige = Math.max(0, A.prestige - 10); A.legitimacy -= 5;
    const regained = [];
    G.S.filter(s => s.owner === w.att && (s.occ || 0) >= 0.5 && w.defAll.includes(s.occBy)).sort((x, y) => y.popBase - x.popBase).slice(0, 3).forEach(s => { transferState(s, w.def); regained.push(s.name); });
    notify('war', `${D.name} ha repelido la invasión de ${A.name}${regained.length ? ' y se anexiona ' + regained.join(', ') : ''}.`, w.cTargets[0] ?? w.targets[0]);
    addRel(w.att, w.def, 10); cnt(D, 'defended'); cnt(D, 'warsWon'); cnt(D, 'statesGained', regained.length);
  }
  G.tags.forEach(t => { if (t !== NONE) G.C[t].legitimacy = clamp(G.C[t].legitimacy, 0, 100); });
  recalcHostile(); evacuateForeignArmies();
}
function clearOccupationKeep(w) {
  const ch = new Set();
  G.P.forEach((p, pid) => { const sid = provState(pid), o = G.S[sid].owner; if ((p.by || p.prog > 0) && ((w.attAll.includes(p.by || p.pby) && w.defAll.includes(o)) || (w.defAll.includes(p.by || p.pby) && w.attAll.includes(o)))) { p.by = null; p.prog = 0; ch.add(sid); MAP.provs[pid].nb.forEach(q => ch.add(provState(q))); } });
  ch.forEach(sid => { const s = G.S[sid]; refreshStateOcc(sid); s._occNotified = false; });
  if (ch.size && typeof onFrontChanged === 'function') onFrontChanged(ch);
}

/* ---------- vasallos ---------- */
function makeSubject(over, sub) {
  const O = G.C[over], S = G.C[sub];
  S.overlord = over; O.subjects = (O.subjects || []).concat([sub]);
  if (S.bloc) leaveBloc(sub, true);
  G.pacts = G.pacts.filter(p => !(p.type === 'alliance' && (p.a === sub || p.b === sub) && !p.forced));
  addRel(over, sub, 30);
  notify('diplo', `${S.name} se convierte en vasallo de ${O.name}.`);
}
function releaseSubject(over, sub) {
  const O = G.C[over], S = G.C[sub]; if (S.overlord !== over) return;
  S.overlord = null; O.subjects = (O.subjects || []).filter(x => x !== sub); addRel(over, sub, 20);
  notify('diplo', `${S.name} es liberado por ${O.name}.`);
}
function annexSubject(over, sub) {
  const O = G.C[over], S = G.C[sub];
  if (S.overlord !== over) return {ok: false, msg: 'No es tu vasallo.'};
  if (!O.ai && O.influence < 80) return {ok: false, msg: 'Necesitas 80 de influencia.'};

}

/* ---------- pactos ---------- */
// Probabilidad de que un país acepte una propuesta
function acceptChance(type, from, to, level) {
  const F = G.C[from], T = G.C[to]; const reasons = [];
  if (!alive(to)) return {p: 0, reasons: ['El país ya no existe']};
  if (T.overlord && T.overlord !== from && type !== 'trade') return {p: 0, reasons: ['Es vasallo de otro país']};
  let s = relOf(to, from);
  reasons.push(`Relaciones: ${sgn(s, 0)}`);
  const pf = armyPower(F), pt = armyPower(T);
  const ratio = pf / Math.max(1, pt);
  const commonEnemy = G.wars.some(w => (w.attAll.includes(from) && w.attAll.includes(to)) || (w.defAll.includes(from) && w.defAll.includes(to)));
  if (commonEnemy) { s += 20; reasons.push('Enemigo común: +20'); }
  if (F.profile === T.profile) { s += 6; reasons.push('Regímenes afines: +6'); }
  if (F.infamy > 30) { s -= F.infamy * 0.4; reasons.push('Infamia: ' + sgn(-F.infamy * 0.4, 0)); }
  if (atWarWith(from, to)) return {p: 0, reasons: ['Estáis en guerra']};
  if (type === 'rival' || type === 'embargo') return {p: 1, reasons: []};
  let th = 0;
  switch (type) {
    case 'alliance': th = 35; if (ratio < 0.35) { th += 15; reasons.push('Eres demasiado débil: +15 exigido'); } if (T.rank < F.rank - 6) { th -= 5; } if (inWar(to) && !commonEnemy) { th += 10; } break;
    case 'guarantee': th = pt < pf ? -10 : 15; break;
    case 'nonagg': th = 5; break;
    case 'trade': th = 0; break;
    case 'subsidy': th = -40; break;
  }
  if (anyPactBetween(from, to, ['rival']) || pactBetween('rival', to, from)) { s -= 40; reasons.push('Rivalidad: −40'); }
  const p = clamp(0.5 + (s - th) / 60, 0, 0.97);
  return {p, reasons, th};
}
function makePact(type, a, b, opts) {
  opts = opts || {};

  const def = PACTS[type];
  const p = {id: G.nextId++, type, a, b, since: {y: G.date.y, m: G.date.m}, until: def.years ? {y: G.date.y + def.years, m: G.date.m} : null, level: opts.level || 1, forced: !!opts.forced};
  G.pacts.push(p);
  const bonus = {alliance: 25, guarantee: 15, nonagg: 8, trade: 12, subsidy: 12, embargo: -35, rival: -20}[type] || 0;
  addRel(a, b, bonus);
  if (type === 'embargo') recalcTradeLoss();
  return p;
}
function breakPact(id, by) {
  const i = G.pacts.findIndex(p => p.id === id); if (i < 0) return;
  const p = G.pacts[i]; G.pacts.splice(i, 1);
  const other = p.a === by ? p.b : p.a;
  if (by && !p.forced && ['alliance', 'guarantee', 'nonagg', 'trade'].includes(p.type)) { addRel(by, other, -25); if (G.C[by]) G.C[by].prestige = Math.max(0, G.C[by].prestige - 2); }
  if (p.type === 'embargo') recalcTradeLoss();
  return p;
}
function recalcTradeLoss() {
  G.tags.forEach(t => { const c = G.C[t]; let loss = 0; G.pacts.forEach(p => { if (p.type === 'embargo' && p.b === t) loss += 0.04 * (G.C[p.a].rank <= 8 ? 1.4 : 1); }); c.tradeLoss = Math.min(0.25, loss + (c.forcedLoss || 0)); });
}
// Propuesta del jugador: se paga influencia, la IA decide
function playerProposePact(type, to, level) {
  const me_ = G.C[G.player], def = PACTS[type];
  if (me_.influence < def.cost) return {ok: false, msg: `Necesitas ${def.cost} de influencia.`};
  if (pactBetween(type, G.player, to) || (def.mutual && pactBetween(type, to, G.player))) return {ok: false, msg: 'Ya existe este acuerdo.'};
  if (type === 'alliance' && me_.overlord) return {ok: false, msg: 'Un vasallo no puede aliarse.'};
  const r = acceptChance(type, G.player, to, level);
  me_.influence -= def.cost;
  if (type === 'embargo' || type === 'rival') { makePact(type, G.player, to); return {ok: true, msg: `${def.name} establecido contra ${G.C[to].name}.`}; }
  if (Math.random() < r.p) { const p = makePact(type, G.player, to, {level}); cnt(me_, 'pactsMade'); return {ok: true, msg: `${G.C[to].name} acepta: ${def.name}.`, pact: p}; }
  return {ok: false, msg: `${G.C[to].name} rechaza la propuesta de ${def.name.toLowerCase()}.`};
}

/* ---------- reclamaciones ---------- */
function startFabricate(c, sid) {

  if (hasClaim(c, sid)) return {ok: false, msg: 'Ya tienes una reclamación sobre ese estado.'};

}

}

/* ---------- bloques ---------- */
function blocMax(c) { return 3 + Math.floor(c.prestige / 40); }

}

  if (!silent) { b.members.forEach(m => addRel(m, tag, -15)); c.prestige = Math.max(0, c.prestige - 2); notify('diplo', `${c.name} abandona el bloque «${b.name}».`); }
  if (b.leader === tag) {
    if (b.members.length) { b.leader = b.members.slice().sort((x, y) => G.C[y].prestige - G.C[x].prestige)[0]; }
    else G.blocs = G.blocs.filter(x => x !== b);

}

function blocInviteChance(b, tag) {
  const c = G.C[tag], L = G.C[b.leader];
  if (c.bloc) return {p: 0, why: 'Ya está en otro bloque'};
  if (c.overlord && c.overlord !== b.leader) return {p: 0, why: 'Es vasallo de otro país'};
  if (b.members.length >= blocMax(L)) return {p: 0, why: 'El bloque está lleno'};

  if (b.members.some(m => pactBetween('rival', m, tag) || pactBetween('rival', tag, m))) s -= 30;
  if (pactBetween('alliance', b.leader, tag)) s += 20;

}
function playerInviteBloc(tag) {
  const b = blocOf(G.player); if (!b || b.leader !== G.player) return {ok: false, msg: 'Solo el líder puede invitar.'};
  const c = me(); if (c.influence < 20) return {ok: false, msg: 'Necesitas 20 de influencia.'};
  const r = blocInviteChance(b, tag); c.influence -= 20;
  if (Math.random() < r.p) { joinBloc(tag, b); return {ok: true, msg: `${G.C[tag].name} acepta unirse al bloque.`}; }
  return {ok: false, msg: `${G.C[tag].name} rechaza la invitación.`};

/* ---------- IA diplomática mensual ---------- */
function diploMonth() {
  // relaciones: decaimiento hacia 0, efectos de pactos, infamia y rivalidades
  G.tags.forEach(t => {
    if (t === NONE) return; const c = G.C[t];
    for (const o in c.relations) { let r = c.relations[o]; r *= 0.985; c.relations[o] = r; }
    c.infamy = Math.max(0, c.infamy - 0.7);
  });
  G.pacts.forEach(p => {
    if (!G.C[p.a] || !G.C[p.b]) return;
    const bonus = {alliance: 0.8, guarantee: 0.5, nonagg: 0.2, trade: 0.4, subsidy: 0.8, embargo: -1.2, rival: -1}[p.type] || 0;
    addRel(p.a, p.b, bonus);
  });
  G.blocs.forEach(b => { b.members.forEach(m => b.members.forEach(n => { if (m < n) addRel(m, n, 0.3); })); G.C[b.leader].prestige += 0.15 * b.members.length; });
  G.tags.forEach(t => { if (t !== NONE && G.C[t].infamy > 25) { const c = G.C[t]; G.tags.forEach(o => { if (o !== NONE && o !== t) { const C2 = G.C[o]; C2.relations[t] = clamp((C2.relations[t] ?? 0) - c.infamy / 90, -100, 100); } }); } });
  // caducidad de pactos y condiciones
  for (let i = G.pacts.length - 1; i >= 0; i--) {
    const p = G.pacts[i];
    if (!alive(p.a) || !alive(p.b)) { G.pacts.splice(i, 1); continue; }
    if (p.until && (G.date.y > p.until.y || (G.date.y === p.until.y && G.date.m >= p.until.m))) { G.pacts.splice(i, 1); if (p.a === G.player || p.b === G.player) notify('diplo', `Ha caducado: ${PACTS[p.type].name} entre ${G.C[p.a].name} y ${G.C[p.b].name}.`); }
    else if (['alliance', 'guarantee', 'trade', 'nonagg'].includes(p.type) && relOf(p.a, p.b) < -40 && !p.forced && Math.random() < 0.3) {
      G.pacts.splice(i, 1); if (p.a === G.player || p.b === G.player) notify('diplo', `${PACTS[p.type].name} roto por el deterioro de relaciones.`);
    }
  }
  recalcTradeLoss();
  G.tags.forEach(t => { if (t !== NONE) stepFabricate(G.C[t]); });
  // propuestas pendientes caducan
  G.proposals = G.proposals.filter(pp => G.date.t - pp.t < 180 && alive(pp.from));
  // IA
  G.tags.forEach(t => {
    const c = G.C[t]; if (t === NONE || !c.ai || !c.states.length) return;
    if (Math.random() < 0.14) aiDiploAction(c);
    if (c.bloc) aiBlocAction(c);
    else if (!c.overlord && c.rank <= 10 && c.prestige >= 30 && Math.random() < 0.015) createBloc(t, pick(['military', 'economic', 'political']));
    if (!c.fabricating && Math.random() < 0.015 && c.rank <= 18) aiFabricate(c);
    // vasallos pueden independizarse o ser anexionados por IA
    if (c.subjects && c.subjects.length && Math.random() < 0.04) { const sb = pick(c.subjects); if (G.C[sb].ai || true) { if (c.ai && Math.random() < 0.3 && sb !== G.player) annexSubject(t, sb); } }
  });
  // vasallo rebelde si el soberano se debilita
  G.tags.forEach(t => { const c = G.C[t]; if (c && c.overlord && G.C[c.overlord].rank > c.rank + 10 && Math.random() < 0.05) releaseSubject(c.overlord, t); });
  aiWarsNew();
}
function aiCandidates(c, n) {
  const out = G.tags.filter(o => o !== NONE && o !== c.tag && alive(o) && G.C[o].rank <= 40).map(o => ({o, s: relOf(c.tag, o) + (canReach(c.tag, o) ? 12 : 0) + (G.C[o].profile === c.profile ? 5 : 0) + rnd(-12, 12)})).sort((a, b) => b.s - a.s);
  return out.slice(0, n).map(x => x.o);
}
function aiDiploAction(c) {
  const cand = aiCandidates(c, 5); if (!cand.length) return;
  const o = pick(cand);
  const w = [['trade', 5], ['nonagg', 2.5], ['alliance', 2.2], ['guarantee', 1.3], ['subsidy', 0.12], ['embargo', relOf(c.tag, o) < -25 ? 1.2 : 0], ['rival', relOf(c.tag, o) < -15 ? 1 : 0]];
  let tot = w.reduce((a, x) => a + x[1], 0), r = Math.random() * tot, type = 'trade';
  for (const x of w) { if ((r -= x[1]) <= 0) { type = x[0]; break; } }
  if (pactBetween(type, c.tag, o) || (PACTS[type].mutual && pactBetween(type, o, c.tag))) return;
  if (type === 'alliance' && c.overlord) return;
  if (type === 'embargo' || type === 'rival') { if (relOf(c.tag, o) < -20) makePact(type, c.tag, o); return; }
  if (o === G.player) {
    if (G.proposals.some(pp => pp.from === c.tag && pp.type === type)) return;
    if (relOf(o, c.tag) < -5 && type !== 'trade') return;
    G.proposals.push({id: G.nextId++, from: c.tag, type, t: G.date.t});
    notify('diplo', `${c.name} te propone: ${PACTS[type].name}. Revisa Diplomacia.`);
    return;
  }
  const r2 = acceptChance(type, c.tag, o);
  if (Math.random() < r2.p * 0.8) makePact(type, c.tag, o, {level: 1});
}
function aiBlocAction(c) {
  const b = blocOf(c.tag); if (!b) return;

}
function aiFabricate(c) {

}
function aiWarsNew() {

  if (!cand.length || Math.random() > 0.08 * (G.diff >= 3 ? 1.3 : 1)) return;

}

  c.influence -= 20; addRel(c.tag, tag, 25); return true;
}
// Acciones adicionales de diplomacia
function giftMoney(c, tag) {

function aiMilitary() {
  G.tags.forEach(t => {
    if (t === NONE) return; const c = G.C[t];
    if (!c.ai || !c.wars.length) return;
    const enemies = G.tags.filter(o => hostileTags(t, o));
    if (!enemies.length) return;
    const mine = armiesOf(t).filter(a => !a.battle);
    const capital = c.capital; const capP = capital >= 0 ? stateCapitalProv(capital) : -1;
    const capNear = capital >= 0 ? new Set(MAP.stats[capital].provs.concat(...MAP.stats[capital].provs.map(p => MAP.provs[p].nb))) : new Set();
    const threat = capital >= 0 && [...capNear].some(n => armiesAt(n).some(o => hostileTags(t, o.tag)));
    let eList = null;
    mine.forEach(a => {
      if (a.front) return;
      if (a.path.length && !threat) return;
      if (threat && capP >= 0 && !capNear.has(a.loc)) { const near = provDist(a.loc, capP) < 12; if (near || mine.length < 3) { orderMove(a, capP); return; } }
      if (a.path.length) return;
      const strA = armyStr(a) * a.divs.length;
      if ((armyOrg(a) < 0.55 || (a.sup !== undefined && a.sup < 0.4)) && provOwner(a.loc) === t) return;
      const cands = [];
      MAP.provs[a.loc].nb.forEach(pid => {
        if (!canEnter(t, pid)) return;
        const foes = armiesAt(pid).filter(o => hostileTags(t, o.tag)); const fs = foes.reduce((x, o) => x + armyStr(o) * o.divs.length, 0);
        const owner = provOwner(pid); const enemyOwned = owner !== NONE && hostileTags(t, owner);
        if (!enemyOwned && !foes.length) return;
        if (fs > strA * 1.3) return;
        const pr = G.P[pid];
        let score = 10 - fs * 2 + (enemyOwned ? 4 : 0) + (pr.by && sameSide(t, pr.by) ? -8 : 0) + (!pr.by ? 2 : 0);
        const sid = provState(pid);
        G.wars.forEach(w => { if (w.targets.includes(sid) && w.attAll.includes(t)) score += 6; });
        if (enemies.some(e => G.C[e].capital === sid)) score += 5;
        cands.push({pid, score});
      });
      if (!cands.length) {
        let tgt = null, td = 1e9;
        G.armies.forEach(o => { if (!hostileTags(t, o.tag) || o.battle) return; const os = provOwner(o.loc); if (os !== t && !sameSide(t, os)) return; const d = provDist(a.loc, o.loc); if (d < td && armyStr(o) * o.divs.length < strA * 1.4) { td = d; tgt = o.loc; } });
        if (tgt !== null && tgt !== a.loc) { orderMove(a, tgt); return; }
      }
      if (cands.length) { cands.sort((x, y) => y.score - x.score); orderMove(a, cands[0].pid); return; }
      eList = eList || enemyProvList(t, enemies);
      let best = null, bd = 1e9;
      eList.forEach(pid => { const d = provDist(a.loc, pid) - (G.wars.some(w => w.targets.includes(provState(pid))) ? 4 : 0); if (d < bd) { bd = d; best = pid; } });
      if (best !== null && best !== a.loc) { const p = findPath(a, best); if (p && p.length) { a.path = p.slice(0, 60); a.dest = best; a.hop = hopDays(a, a.loc, p[0]); } }
    });
  });
}

function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

const RAMP_HEAT = [[236, 226, 160], [226, 168, 84], [196, 96, 60], [120, 36, 36]];
const RAMP_SOL = [[168, 52, 52], [214, 150, 66], [220, 208, 90], [100, 168, 82], [52, 130, 100]];
const RAMP_BLUE = [[190, 206, 220], [102, 150, 196], [48, 98, 160], [24, 48, 110]];
const RAMP_RAD = [[120, 168, 96], [220, 208, 90], [208, 110, 60], [150, 30, 30]];

function stateFill(s) {
  // devuelve [r, g, b, alpha]
  const c = G.C[s.owner];
  switch (R.mode) {
    case 'political': { if (s.owner === NONE) return [...hex2rgb(NEUTRAL_COLOR), 0.28]; return [...(c._rgb || (c._rgb = hex2rgb(c.color))), 0.72]; }
    case 'terrain': return [0, 0, 0, 0];
    case 'population': { const d = s.popBase * 1000 / Math.max(1, MAP.stats[s.id].area * Math.cos(yToLat(MAP.stats[s.id].sy / Math.max(1, MAP.stats[s.id].area)) * Math.PI / 180)); return [...ramp(RAMP_HEAT, Math.sqrt(d / 380)), 0.85]; }
    case 'sol': return [...ramp(RAMP_SOL, s.solAvg / 20), 0.82];
    case 'literacy': { const l = c.lit * (0.7 + 0.6 * clamp(G.C[s.owner].ind * 2, 0, 1)) ; return [...ramp(RAMP_BLUE, l / 90), 0.8]; }
    case 'prosperity': { const g = s.gdp / Math.max(1, popTotal(s)); return [...ramp(RAMP_BLUE, (g - 0.6) / 2.2), 0.82]; }
    case 'radicals': return [...ramp(RAMP_RAD, c.radicals / 0.4), s.owner === NONE ? 0.2 : 0.82];
    case 'blocs': {
      if (s.owner === NONE) return [...hex2rgb(NEUTRAL_COLOR), 0.18];
      const b = blocOf(s.owner);
      if (b) return [...(b._rgb || (b._rgb = hex2rgb(b.color))), 0.86];
      return [150, 150, 150, 0.35];
    }
    case 'diplomacy': {
      const me = G.C[G.player];
      if (s.owner === G.player) return [90, 140, 200, 0.85];
      if (s.owner === NONE) return [...hex2rgb(NEUTRAL_COLOR), 0.2];
      if (me.overlord === s.owner || G.C[s.owner].overlord === G.player) return [150, 90, 200, 0.85];
      if (pactBetween('alliance', G.player, s.owner)) return [60, 130, 220, 0.9];
      if (pactBetween('guarantee', G.player, s.owner) || pactBetween('guarantee', s.owner, G.player)) return [60, 190, 200, 0.85];
      if (pactBetween('embargo', G.player, s.owner) || pactBetween('embargo', s.owner, G.player)) return [140, 60, 140, 0.85];

function initRenderer(canvas) {
  const W = MAP_W, H = MAP_H;

  R.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  R.cv = document.createElement('canvas'); R.cv.width = W; R.cv.height = H;
  R.ctx = R.cv.getContext('2d');
  R.img = R.ctx.createImageData(W, H);

  R.tex.anisotropy = Math.min(8, R.renderer.capabilities.getMaxAnisotropy());
  R.tex.colorSpace = THREE.SRGBColorSpace || undefined;

  R.tex.magFilter = THREE.LinearFilter;
  // geometría con relieve
  const nx = 720, nz = 288;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array((nx + 1) * (nz + 1) * 3), uv = new Float32Array((nx + 1) * (nz + 1) * 2);
  const hgt = MAP.height;
  const hs = (px, py) => {
    px = clamp(px, 0, W - 1.001); py = clamp(py, 0, H - 1.001);
    const x0 = px | 0, y0 = py | 0, fx = px - x0, fy = py - y0, i = y0 * W + x0;
    return (hgt[i] * (1 - fx) + hgt[i + 1] * fx) * (1 - fy) + (hgt[i + W] * (1 - fx) + hgt[i + W + 1] * fx) * fy;
  };
  let k = 0, u = 0;
  for (let j = 0; j <= nz; j++) for (let i = 0; i <= nx; i++) {
    const fx = i / nx, fy = j / nz;
    const lon = -180 + fx * 360, lat = LAT_TOP - fy * (LAT_TOP - LAT_BOT);
    const h = hs(fx * (W - 1), fy * (H - 1));
    pos[k++] = lon; pos[k++] = (h > 0 ? h * R.exag : h * 0.35); pos[k++] = -lat;
    uv[u++] = fx; uv[u++] = 1 - fy;
  }
  const idx = new Uint32Array(nx * nz * 6); let q = 0;
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const a = j * (nx + 1) + i, b = a + 1, c = a + nx + 1, d = c + 1;
    idx[q++] = a; idx[q++] = c; idx[q++] = b; idx[q++] = b; idx[q++] = c; idx[q++] = d;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({map: R.tex});
  R.mesh = new THREE.Mesh(geo, mat);
  R.scene.add(R.mesh);
  R.scene.add(new THREE.AmbientLight(0xffffff, 0.92));
  const dl = new THREE.DirectionalLight(0xfff0d8, 0.55); dl.position.set(-60, 90, -40); R.scene.add(dl);
  // marco alrededor del mapa
  const frame = new THREE.Mesh(new THREE.PlaneGeometry(2000, 1200), new THREE.MeshBasicMaterial({color: 0x101a22}));
  frame.rotation.x = -Math.PI / 2; frame.position.y = -2; R.scene.add(frame);
  R.raycaster = new THREE.Raycaster();
  R.plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.2);
  R.labelRoot = document.getElementById('labels');
  R.markerRoot = document.getElementById('markers');

  window.addEventListener('resize', resizeRenderer);

}

R.occRGB = tag => (R._rgb = R._rgb || {})[tag] || (R._rgb[tag] = hex2rgb(G.C[tag].color));
function paintPixel(i, fill, hov, sel) {
  const tc = MAP.terrainCol, d = R.img.data, o = i * 4;
  let r = tc[o], g = tc[o + 1], b = tc[o + 2];
  const pr = G.P ? G.P[MAP.provOf[i]] : null;
  if (fill[3] > 0) {

  } else if (MAP.pedge[i]) { r *= 0.84; g *= 0.84; b *= 0.84; }

/* ---------- etiquetas ---------- */
function computeLabels() {
  R.labels = [];
  const seen = new Set();
  const byOwner = {};
  G.S.forEach(s => (byOwner[s.owner] = byOwner[s.owner] || []).push(s));
  for (const tag in byOwner) {
    if (tag === NONE) continue;
    const list = byOwner[tag]; const set = new Set(list.map(s => s.id));
    let best = null;
    list.forEach(s0 => {
      if (seen.has(s0.id)) return;
      const comp = []; const stack = [s0.id]; seen.add(s0.id);
      while (stack.length) { const id = stack.pop(); comp.push(G.S[id]); G.S[id].neigh.forEach(n => { if (set.has(n) && !seen.has(n)) { seen.add(n); stack.push(n); } }); }
      const area = comp.reduce((a, s) => a + MAP.stats[s.id].area, 0);
      const score = comp.reduce((a, s) => a + s.popBase, 0) + (comp.some(s => s.id === G.C[tag].capital) ? 1e9 : 0);
      if (!best || score > best.score) best = {comp, area, score};
    });
    if (!best) continue;
    let sx = 0, sy = 0, a = 0, x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    best.comp.forEach(s => { const st = MAP.stats[s.id]; sx += st.sx; sy += st.sy; a += st.area; x0 = Math.min(x0, st.x0); x1 = Math.max(x1, st.x1); y0 = Math.min(y0, st.y0); y1 = Math.max(y1, st.y1); });
    const lon = xToLon(sx / a), lat = yToLat(sy / a);
    const c = G.C[tag];
    R.labels.push({tag, name: c.name.toUpperCase(), lon, lat, wDeg: (x1 - x0) / MAP_W * 360, hDeg: (y1 - y0) / MAP_H * 144, area: best.area, el: null});
  }

  R.labels.forEach(l => { const el = document.createElement('div'); el.className = 'maplabel'; el.textContent = l.name; R.labelRoot.appendChild(el); l.el = el; });
  R.sLabels = G.S.map(s => { const c = stateCenter(s); const el = document.createElement('div'); el.className = 'statelabel'; el.textContent = s.name; R.labelRoot.appendChild(el); return {lon: c[0], lat: c[1], el, id: s.id}; });
  R.labelsDirty = true;
}

function updateLabels() {

    const on = fs >= 10 && p[0] > -100 && p[0] < cw + 100 && p[1] > -50 && p[1] < ch + 50 && pxPerDeg < 17;
    if (on) { l.el.style.display = 'block'; l.el.style.fontSize = fs.toFixed(1) + 'px'; l.el.style.transform = `translate(-50%,-50%) translate(${p[0].toFixed(1)}px,${p[1].toFixed(1)}px)`; l.el.style.letterSpacing = (fs * 0.14).toFixed(1) + 'px'; } else l.el.style.display = 'none';

    case 'ukj': g = `<rect width="30" height="20" fill="${c[0]}"/><path d="M0 0L30 20M30 0L0 20" stroke="${c[1]}" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="${c[2]}" stroke-width="1.4"/><path d="M15 0V20M0 10H30" stroke="${c[1]}" stroke-width="6"/><path d="M15 0V20M0 10H30" stroke="${c[2]}" stroke-width="3.2"/>`; break;
    case 'usa': {

  if (mx - mn < 1e-9) { mx += 1; mn -= 1; }
  const pts = arr.map((v, i) => `${(i / (arr.length - 1) * (w - 2) + 1).toFixed(1)},${(h - 2 - (v - mn) / (mx - mn) * (h - 4)).toFixed(1)}`).join(' ');
  const bl = base !== undefined ? `<line x1="0" x2="${w}" y1="${(h - 2 - (base - mn) / (mx - mn) * (h - 4)).toFixed(1)}" y2="${(h - 2 - (base - mn) / (mx - mn) * (h - 4)).toFixed(1)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="2 2"/>` : '';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${bl}<polyline fill="none" stroke="${color}" stroke-width="1.6" points="${pts}"/></svg>`;
}
const bar = (v, max, cls = '', label = '') => `<div class="bar ${cls}"><i style="width:${clamp(v / max, 0, 1) * 100}%"></i>${label ? `<span>${label}</span>` : ''}</div>`;

function minimapJump(e) {

const WINDOWS = {};
function openWindow(id) {
  if (UI.win === id) { closeWindow(); return; }

}
function closeWindow() { UI.win = null; $('#windows').innerHTML = ''; $('#windows').classList.remove('open'); $$('#menu .mbtn').forEach(b => b.classList.remove('on')); }
function renderWindow(fresh) {
  if (!UI.win) return;
  const w = WINDOWS[UI.win]; const root = $('#windows');
  const prev = root.querySelector('.wbody'); const sc = prev && !fresh ? prev.scrollTop : 0;

  root.classList.add('open');

  iconize(root); const nb = root.querySelector('.wbody'); if (nb) nb.scrollTop = sc;
  if (!fresh) $$('.scrollable', root).forEach((e, i) => { if (scs[i] !== undefined) e.scrollTop = scs[i]; });
}

function tabs(key, list) {
  const cur = UI.winTab[key] || list[0][0];
  return `<div class="tabs">${list.map(([id, name]) => `<button class="tab ${cur === id ? 'on' : ''}" data-act="tab" data-k="${key}" data-t="${id}">${name}</button>`).join('')}</div>`;
}
const curTab = (key, def) => UI.winTab[key] || def;

function countryAgg(c) {
  const a = {prof: {}, strata: {upper: 0, middle: 0, lower: 0}, pop: 0, inc: {}, sol: {}};
  PROF_ORDER.forEach(p => { a.prof[p] = 0; a.inc[p] = 0; a.sol[p] = 0; });
  c.states.forEach(i => {
    const s = G.S[i];
    for (const p in s.pops) { const n = s.pops[p]; a.prof[p] += n; a.pop += n; a.strata[PROFS[p].strat] += n; a.inc[p] += s.inc[p] || 0; a.sol[p] += (s.sol[p] || 0) * n; }
  });
  PROF_ORDER.forEach(p => { a.sol[p] = a.prof[p] ? a.sol[p] / a.prof[p] : 0; });
  return a;
}

function crisisTab() {

  const risk = ratio > 50 ? ['Riesgo de bancarrota', 'bad'] : ratio > 26 ? ['Deuda peligrosa', 'bad'] : ratio > 10 ? ['Deuda elevada', 'warn'] : ['Finanzas sanas', 'good'];

   <div class="kv"><span>Resistencia a crisis</span><b>${pctS(c.mods.crisis || 0)}</b></div>
  </div>
  <div class="card"><h3>Respuestas del gobierno</h3>
   <button class="block" data-act="crisisr" data-k="bailout" ${c.treasury < inc * 5 ? 'disabled' : ''}>🏦 Rescate bancario <small>${money(inc * 5)}</small></button>

/* ---------- bucle principal ---------- */
const SPEED_MS = [0, 900, 450, 200, 80, 25];
let _gt = 0;
window.onFrame = function (t) {
  if (!UI.started) return;
  const dt = t - _gt; _gt = t;
  if (!G.paused && !G.pendingEvent) {
    UI.acc += Math.min(dt, 200);
    let n = 0;
    while (UI.acc >= SPEED_MS[UI.speed] && n < 40) {
      UI.acc -= SPEED_MS[UI.speed]; const m0 = G.date.m;
      advanceDay(); n++;
      if (G.date.m !== m0 && R.mode !== 'political' && R.mode !== 'terrain') R.needPaint = true;
      if (G.date.m !== m0 && G.date.m === 0) doSave(true);
      if (G.pendingEvent) break;
    }
    if (n) { R.labelsDirty = true; if (UI.selArmy) renderArmyPanel(); }
  }
  if (G.pendingEvent && !$('#event').classList.contains('open')) showEvent();
  if (R.needPaint) { R.needPaint = false; fullRepaint(); }
  if (G.notifs.length) drainNotifs();
  if (t - UI.lastHud > 250) { UI.lastHud = t; updateHud(); if (UI.sel !== null && UI.sel >= 0 && t - UI.lastWin > 1500) renderStatePanel(); }
  if (UI.win && t - UI.lastWin > 1500 && !G.paused && !(document.activeElement && /input|select/i.test(document.activeElement.tagName))) { UI.lastWin = t; renderWindow(); }
  if (R.minimapDirty) R.dirty = true;
};

// Selección con pesos, contexto y espaciado mínimo
function randomEvents() {
  const c = G.C[G.player];
  if (G.pendingEvent) return;
  if (G.lastEventT !== undefined && G.date.t - G.lastEventT < 40) return;
  if (Math.random() > 0.24) return;
  const ok = EVENTS.filter(e => (e.w === undefined || e.w > 0) && !(G.eventCool[e.id] > G.date.t) && (() => { try { return e.cond(c); } catch (_) { return false; } })());
  if (!ok.length) return;
  let tot = 0; ok.forEach(e => tot += e.w || 1);
  let r = Math.random() * tot, e = ok[0];
  for (const x of ok) { r -= x.w || 1; if (r <= 0) { e = x; break; } }
  G.eventCool[e.id] = G.date.t + 365 * (e.cool || 1.3); G.lastEventT = G.date.t;
  const ctx = e.ctx ? e.ctx(c) : null;
  G.pendingEvent = {id: e.id, title: e.title, icon: e.icon || '📰', text: e.text(c, ctx), ctx};
}
function resolveEvent(i) {
  const pe = G.pendingEvent; if (!pe) return;
  const e = EVENTS.find(x => x.id === pe.id); const c = G.C[G.player]; const o = e.opts[i];
  if (o.cost) c.treasury -= c.stats.income * o.cost;
  G.pendingEvent = null;
  try { o.fx(c, pe.ctx); } catch (err) { console.warn('evento', err); }
  cnt(c, 'events');
  c.legitimacy = clamp(c.legitimacy, 0, 100);
}

const ACH_KEY = 'victoria-replica-ach';
function globalAch() { try { return new Set(JSON.parse(localStorage.getItem(ACH_KEY) || '[]')); } catch (e) { return new Set(); } }
function saveGlobalAch(set) { try { localStorage.setItem(ACH_KEY, JSON.stringify([...set])); } catch (e) {} }
function achSnapshot(c) { c.preAch = {}; ACHIEVEMENTS.forEach(a => { try { if (a.check(c)) c.preAch[a.id] = 1; } catch (e) {} }); }
function achMonth(c) {
  c.ach = c.ach || {}; c.cnt = c.cnt || {};
  if (c.treasury < 0) cnt(c, 'debtMonths');
  if (c.wars.length) c.cnt.peaceMonths = 0; else cnt(c, 'peaceMonths');
  const gl = globalAch(); let changed = false;
  ACHIEVEMENTS.forEach(a => {
    if (c.ach[a.id] || (c.preAch && c.preAch[a.id])) return;
    let ok = false; try { ok = a.check(c); } catch (e) { ok = false; }
    if (!ok) return;
    c.ach[a.id] = {y: G.date.y, m: G.date.m};
    const rp = 4 * a.tier, ri = 40 * a.tier * a.tier;
    c.prestige += rp; c.innovStock += ri;
    notify('journal', `🏅 Logro desbloqueado: ${a.name} (+${rp} prestigio, +${ri} innovación).`);
    if (!gl.has(a.id)) { gl.add(a.id); changed = true; }
  });
  if (changed) saveGlobalAch(gl);
}

    const got = c.ach[a.id]; const pre = !got && c.preAch && c.preAch[a.id]; let p = ''; if (!got && a.prog) { try { const [v, g] = a.prog(c); p = `<div class="achp">${bar(Math.max(0, Math.min(v, g)), g, 'gold')}</div>`; } catch (e) {} }
    return `<div class="ach ${got ? 'got' : ''} ${pre ? 'pre' : ''} t${a.tier}"><span class="achi">${got ? a.icon : pre ? '➖' : '🔒'}</span><div><b>${a.name}</b> <span class="stars">${'★'.repeat(a.tier)}</span><small>${a.desc}</small>${got ? `<small class="good">Desbloqueado en ${MONTHS[got.m]} de ${got.y}</small>` : pre ? '<small class="dim">Ya se cumplía al inicio de la partida: no puede obtenerse.</small>' : p}</div></div>`;
  }).join('')}</div>`).join('')}`;
}};
