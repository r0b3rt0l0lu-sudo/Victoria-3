<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Victoria — Una era de revolución (réplica web)</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lato:wght@400;700&display=swap');
:root{
  --bg:#12181d; --panel:#222b33; --panel2:#2b3640; --edge:#0a0e11; --gold:#c9a657; --gold2:#ecd697; --goldd:#7d6733;
  --text:#ebe3cf; --dim:#98a3ab; --good:#8cc47a; --bad:#e07a68; --warn:#e0b45a; --blue:#6fa8d6;
  --head:'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Georgia,serif;
  --body:'Lato','Segoe UI','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1015;color:var(--text);font-family:var(--body);font-size:14px;user-select:none}
body.dragging{cursor:grabbing}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#labels,#markers{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.maplabel{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--head);font-weight:700;color:rgba(250,244,222,.93);text-shadow:0 0 6px rgba(0,0,0,.9),0 1px 2px #000,0 0 14px rgba(0,0,0,.6);will-change:transform}
.statelabel{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--body);font-weight:700;color:rgba(255,255,255,.88);text-shadow:0 0 4px #000,0 1px 2px #000;display:none;will-change:transform}
.marker{position:absolute;left:0;top:0;font-size:22px;filter:drop-shadow(0 2px 3px #000);will-change:transform}
.marker.cap{color:#ffe28a;font-size:20px;text-shadow:0 0 6px #000}
.marker.war{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform-origin:center;opacity:.55}}

/* banderas */
.flag{display:inline-block;width:30px;height:20px;border:1px solid #000;box-shadow:0 0 0 1px rgba(201,166,87,.55),0 2px 4px rgba(0,0,0,.6);vertical-align:middle;overflow:hidden;position:relative;background:var(--fc)}
.flag svg{width:100%;height:100%;display:block}
.flag::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%,rgba(0,0,0,.18))}
.flag.sm{width:22px;height:15px}.flag.md{width:44px;height:29px}.flag.big{width:62px;height:41px}.flag.huge{width:150px;height:100px}
.flag.neutral{background:repeating-linear-gradient(45deg,#6f6a56,#6f6a56 4px,#8f8a74 4px,#8f8a74 8px)}

/* HUD */
#hud{display:none}
#hud.show{display:block}
#plaque{position:fixed;left:10px;top:10px;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 10px;background:linear-gradient(180deg,rgba(40,50,60,.96),rgba(24,31,38,.96));border:1px solid var(--goldd);border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.05);max-width:calc(100vw - 720px)}
#plaque::before{content:"";position:absolute;inset:3px;border:1px solid rgba(201,166,87,.22);border-radius:6px;pointer-events:none}
.crest{padding:4px;background:radial-gradient(#3a4651,#1c242b);border:1px solid var(--gold);border-radius:6px}
.pl-name{font-family:var(--head);font-size:20px;font-weight:700;color:var(--gold2);letter-spacing:.06em;text-shadow:0 1px 2px #000;white-space:nowrap}
.pl-sub{font-size:12px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:5px 6px;max-width:560px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:1px solid rgba(201,166,87,.28);border-radius:14px;padding:3px 10px 3px 6px;font-size:13px;font-weight:700;cursor:default;min-width:64px}
.chip b{font-size:14px}.chip.neg span{color:var(--bad)}
#datebox{position:fixed;right:272px;top:10px;display:flex;align-items:center;gap:10px;padding:6px 14px;background:linear-gradient(180deg,rgba(42,52,62,.97),rgba(22,29,35,.97));border:1px solid var(--gold);border-radius:30px;box-shadow:0 4px 18px rgba(0,0,0,.6)}
#datebox.paused{border-color:#b85a4a}
.date{font-family:var(--head);font-size:16px;font-weight:600;color:var(--gold2);min-width:190px;text-align:center;letter-spacing:.04em}
.spd{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);background:radial-gradient(#3d4a55,#1a2128);color:var(--gold2);cursor:pointer;font-size:13px;padding:0}
.spd:hover{filter:brightness(1.3)}
.speeds{display:flex;gap:3px}
.spd.s{width:14px;height:22px;border-radius:3px;border:1px solid var(--goldd);background:#171e24}
.spd.s.on{background:linear-gradient(#f0d98e,#b08d3c);border-color:#f0d98e}
#topright{position:fixed;right:12px;top:10px;display:flex;gap:8px}
.rbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:radial-gradient(#3d4a55,#161c22);font-size:18px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.6);color:var(--text)}
.rbtn:hover{filter:brightness(1.35)}
#menu{position:fixed;left:12px;bottom:12px;display:flex;gap:10px;padding:8px 14px;background:linear-gradient(180deg,rgba(40,50,60,.92),rgba(20,26,32,.95));border:1px solid var(--goldd);border-radius:36px;box-shadow:0 4px 16px rgba(0,0,0,.6)}
.mbtn{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%,#4a5966,#1b232a 70%);cursor:pointer;font-size:24px;position:relative;box-shadow:inset 0 0 8px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.6);transition:transform .12s,filter .12s;color:var(--text)}
.mbtn:hover{transform:translateY(-3px);filter:brightness(1.3)}
.mbtn.on{background:radial-gradient(circle at 35% 30%,#8a6f2f,#3b3014 75%);border-color:var(--gold2)}
.mbtn span{filter:drop-shadow(0 1px 1px #000)}
#mapctl{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#minimap{width:260px;height:104px;border:2px solid var(--gold);border-radius:4px;background:#0d151b;box-shadow:0 4px 14px rgba(0,0,0,.7);cursor:crosshair;display:block}
#modes{display:flex;gap:4px;padding:4px 6px;background:rgba(18,24,30,.92);border:1px solid var(--goldd);border-radius:20px}
.mode{width:30px;height:30px;border-radius:50%;border:1px solid var(--goldd);background:#1d262d;cursor:pointer;font-size:15px;padding:0}
.mode:hover{filter:brightness(1.4)}.mode.on{background:#6a5524;border-color:var(--gold2)}

/* panel de estado */
#statepanel{position:fixed;left:10px;top:108px;width:340px;max-height:calc(100vh - 210px);overflow-y:auto;background:linear-gradient(180deg,rgba(36,46,55,.97),rgba(22,29,36,.97));border:1px solid var(--goldd);border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.65);display:none;padding:12px}
#statepanel.open{display:block}
.sp-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sp-head h2{margin:0;font-family:var(--head);font-size:20px;color:var(--gold2)}
.sp-head small{color:var(--dim)}
.sp-head .x{margin-left:auto}
.sp-stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.sp-stats div{background:rgba(0,0,0,.28);border:1px solid rgba(201,166,87,.2);border-radius:5px;padding:5px 6px;text-align:center}
.sp-stats small{display:block;font-size:10.5px;color:var(--dim)}.sp-stats b{font-size:13px}
.sp-sec h4{margin:12px 0 6px;font-family:var(--head);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid rgba(201,166,87,.3);padding-bottom:3px}
.brow{display:flex;align-items:center;gap:8px;padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.04)}
.brow .bn{flex:1;min-width:0}.brow .bn b{font-size:13px}.brow .bn small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blv{text-align:right;font-size:13px}.blv small{color:var(--dim)}
.plus{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);background:#2d3a22;color:var(--gold2);cursor:pointer;font-size:14px;padding:0}
.plus:hover:not(:disabled){background:#46602f}.plus:disabled{opacity:.25;cursor:default}.plus.ph{border:none;background:none}
.chips2{display:flex;flex-wrap:wrap;gap:5px}
.gi{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#3a4650;font-size:13px;border:1px solid rgba(255,255,255,.12);vertical-align:middle}

/* ventanas */
#windows{position:fixed;inset:0;pointer-events:none;display:none}
#windows.open{display:block}
.window{pointer-events:auto;position:absolute;left:50%;top:98px;transform:translateX(-50%);width:min(1080px,calc(100vw - 40px));max-height:calc(100vh - 176px);display:flex;flex-direction:column;background:linear-gradient(180deg,#27323b,#1b232a);border:1px solid var(--gold);border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.75),inset 0 0 0 3px rgba(0,0,0,.35),inset 0 0 0 4px rgba(201,166,87,.18)}
.whead{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(180deg,#34414c,#232d36);border-bottom:1px solid var(--goldd);border-radius:7px 7px 0 0}
.whead h2{margin:0;font-family:var(--head);font-size:21px;font-weight:700;letter-spacing:.08em;color:var(--gold2);text-shadow:0 1px 2px #000;flex:1}
.wicon{font-size:22px}
.x{width:28px;height:28px;border-radius:50%;border:1px solid var(--goldd);background:#1a2128;color:var(--text);cursor:pointer;font-size:13px;padding:0}.x:hover{background:#6a2a22}
.wbody{padding:14px 16px 16px;overflow-y:auto}
.cols{display:flex;gap:14px;align-items:flex-start}.col{flex:1;min-width:0}.col.wide{flex:1.7}
.card{background:rgba(0,0,0,.2);border:1px solid rgba(201,166,87,.2);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.card h3,.lawdetail h3,.techcol h3{margin:0 0 8px;font-family:var(--head);font-size:15px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
.hint{color:var(--dim);font-size:12.5px;line-height:1.45;margin:8px 0 0}
.dim{color:var(--dim)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 0;font-size:13.5px}.kv.sm{font-size:12px;padding:1px 0}.kv span:first-child{color:#cfd3d4}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--head);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);text-align:left;padding:6px 8px;border-bottom:1px solid var(--goldd);position:sticky;top:0;background:#222b33}
.tbl td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.05)}.tbl .r{text-align:right}
.tbl tr.tot td{font-weight:700;border-top:1px solid var(--goldd)}
.tbl tr.cat td{background:rgba(201,166,87,.12);font-family:var(--head);color:var(--gold2);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tbl tr.locked td{opacity:.5}.tbl.clickable tbody tr{cursor:pointer}.tbl.clickable tbody tr:hover td{background:rgba(201,166,87,.1)}.tbl tr.sel td{background:rgba(201,166,87,.2)}.tbl tr.me td{color:var(--gold2)}
.scrollable.tall{max-height:min(480px,calc(100vh - 330px));overflow-y:auto}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--goldd)}
.tab{padding:8px 16px;background:#1d262d;border:1px solid var(--goldd);border-bottom:none;border-radius:6px 6px 0 0;color:var(--dim);font-family:var(--head);font-size:13px;letter-spacing:.06em;cursor:pointer}
.tab.on{background:linear-gradient(#5a4a22,#3b3216);color:var(--gold2);border-color:var(--gold)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:rgba(255,255,255,.08);font-size:11.5px;border:1px solid rgba(255,255,255,.1)}
.tag.good{background:rgba(110,170,90,.2);border-color:rgba(110,170,90,.4)}.tag.bad{background:rgba(200,90,70,.2);border-color:rgba(200,90,70,.4)}
.bar{height:11px;background:#0c1115;border:1px solid #000;border-radius:6px;position:relative;overflow:hidden;margin:3px 0 5px;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.bar i{display:block;height:100%;background:linear-gradient(#7fb4d8,#3f7ba3);border-radius:5px}
.bar.good i{background:linear-gradient(#9bd484,#4f8f3f)}.bar.bad i{background:linear-gradient(#e88a76,#a43b2c)}.bar.warn i{background:linear-gradient(#f0c872,#b8832a)}
.bar.gold i{background:linear-gradient(#f0d98e,#a8842f)}.bar.blue i{background:linear-gradient(#8cc4ec,#3a79ac)}
.bar span{position:absolute;inset:0;text-align:center;font-size:9.5px;line-height:10px;color:#fff;text-shadow:0 0 3px #000;font-weight:700}
button{font-family:var(--body);color:var(--text)}
.seg{display:flex;gap:0;margin:6px 0}.seg button{flex:1;padding:6px 4px;background:#1c242b;border:1px solid var(--goldd);color:var(--text);cursor:pointer;font-size:12.5px;font-weight:700}
.seg button small{display:block;font-weight:400;color:var(--dim);font-size:10.5px}.seg button:first-child{border-radius:5px 0 0 5px}.seg button:last-child{border-radius:0 5px 5px 0}
.seg button.on{background:linear-gradient(#7a6329,#4b3c15);color:var(--gold2);border-color:var(--gold)}.seg button:hover{filter:brightness(1.25)}
.seg.sm{margin:0;display:inline-flex}.seg.sm button{padding:3px 7px;font-size:11.5px}
button.primary{background:linear-gradient(#e8cf85,#a6832f);color:#1d1606;border:1px solid #f4e2a6;border-radius:5px;padding:8px 16px;font-weight:700;cursor:pointer;font-family:var(--head);letter-spacing:.05em}
button.primary:hover:not(:disabled){filter:brightness(1.12)}button.cont{display:block;margin-top:12px;padding:9px 18px;background:rgba(0,0,0,.45);border:1px solid var(--gold);border-radius:5px;cursor:pointer;font-family:var(--head);color:var(--gold2);font-size:14px}button.cont:hover{background:rgba(110,90,40,.5)}
button.primary.full{width:100%;margin-top:8px}button.primary.big{padding:14px 34px;font-size:18px;margin-top:20px}
button.danger{background:linear-gradient(#a94b3d,#6e2418);border:1px solid #d98776;border-radius:5px;padding:7px 12px;cursor:pointer;font-weight:700}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.btnrow button,.card button:not(.plus):not(.primary):not(.danger):not(.x){padding:6px 11px;background:#232e37;border:1px solid var(--goldd);border-radius:5px;cursor:pointer;font-size:12.5px}
button:disabled{opacity:.4;cursor:default}button small{opacity:.7;font-size:10.5px}
.notice{background:rgba(201,166,87,.12);border:1px solid rgba(201,166,87,.35);border-radius:5px;padding:8px 10px;margin:8px 0;font-size:13px}
.chartrow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--dim)}
/* política */
.igs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ig{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:8px 10px}
.ig.gov{border-color:var(--gold);box-shadow:inset 0 0 12px rgba(201,166,87,.12)}
.igh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.igh b{display:block;font-size:13.5px}.igh small{color:var(--dim);font-size:11px}
.igi{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid rgba(255,255,255,.25)}
.face{margin-left:auto;font-size:24px}
.laws{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:10px}
.lawcat h4{margin:0 0 5px;font-family:var(--head);font-size:13px;color:var(--gold);letter-spacing:.05em}
.lawopts{display:flex;flex-wrap:wrap;gap:4px}
.lawopt{padding:5px 9px;background:#1d262d;border:1px solid var(--goldd);border-radius:4px;cursor:pointer;font-size:12.5px;color:var(--text)}
.lawopt.act{background:#3b4d29;border-color:#8fb86a}.lawopt.sel{outline:2px solid var(--gold2)}.lawopt.locked{opacity:.5}.lawopt:hover{filter:brightness(1.3)}
.lawdetail{background:rgba(0,0,0,.25);border:1px solid var(--goldd);border-radius:6px;padding:12px 14px}
/* tecnología */
.techcols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tech{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:8px 10px;margin-bottom:8px;position:relative;cursor:pointer}
.tech b{display:block;font-size:13.5px;margin-bottom:2px}.tech small{display:block;font-size:11.5px;color:var(--dim)}.tech small.good{color:var(--good)}
.tech .cost{position:absolute;right:8px;top:8px;font-size:11.5px;color:var(--gold2);font-weight:700}
.tech:hover:not(.lock):not(.done){border-color:var(--gold);background:rgba(201,166,87,.1)}
.tech.done{border-color:#6f9a58;background:rgba(110,170,90,.1);cursor:default}.tech.now{border-color:var(--gold2);background:rgba(201,166,87,.18)}.tech.lock{opacity:.5;cursor:default}
.war{border:1px solid rgba(200,90,70,.4);background:rgba(120,30,20,.12);border-radius:6px;padding:10px;margin-bottom:10px}
.warh{font-size:14px;margin-bottom:6px}.warh span{color:var(--dim);margin:0 4px}
.wbar{height:12px;background:#a33f32;border-radius:6px;position:relative;margin:6px 0;border:1px solid #000;overflow:hidden}.wbar b{position:absolute;left:0;top:0;bottom:0;background:#3f7ba3}.wbar i{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;z-index:2;display:none}
.dipcard{display:flex;gap:12px;align-items:center;margin-bottom:8px}.dipcard h3{margin:0}
.obj{margin-bottom:12px}.obj small{display:block;color:var(--dim);margin:2px 0 4px}.obj.done b{color:var(--good)}
.log .logl{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px}.log small{color:var(--gold);margin-right:4px}
ul.plain{margin:0;padding-left:18px;line-height:1.7;font-size:13px}
/* tooltip y toasts */
#tooltip{position:fixed;display:none;z-index:300;pointer-events:none;max-width:300px;background:linear-gradient(180deg,#1d262d,#10161b);border:1px solid var(--gold);border-radius:5px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.7);line-height:1.4}
#tooltip .tt-h{font-family:var(--head);font-size:15px;color:var(--gold2)}#tooltip .tt-s{color:var(--dim);margin-bottom:4px}
#toasts{position:fixed;right:12px;top:68px;width:330px;display:flex;flex-direction:column;gap:8px;z-index:150;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;padding:9px 12px;background:linear-gradient(180deg,rgba(44,54,64,.97),rgba(26,33,40,.97));border:1px solid var(--goldd);border-left:4px solid var(--gold);border-radius:5px;box-shadow:0 4px 12px rgba(0,0,0,.6);transform:translateX(120%);opacity:0;transition:transform .35s,opacity .35s}
.toast.in{transform:none;opacity:1}.toast.click{cursor:pointer}.toast span{font-size:22px}.toast p{margin:0;font-size:13px;line-height:1.35}
/* evento */
#event{position:fixed;inset:0;background:rgba(5,8,10,.55);display:none;align-items:center;justify-content:center;z-index:200}
#event.open{display:flex}
.evbox{width:min(560px,92vw);background:linear-gradient(180deg,#e8dbb8,#cdbd92);color:#2a2112;border:3px double #7d6733;border-radius:6px;box-shadow:0 14px 50px rgba(0,0,0,.8)}
.evhead{background:linear-gradient(180deg,#3a2f17,#241c0b);padding:14px 20px;border-bottom:3px solid #7d6733}
.evhead h2{margin:0;font-family:var(--head);color:var(--gold2);font-size:23px;letter-spacing:.06em}.evhead small{color:#b6a572}
.evbody{padding:18px 22px 22px}.evbody p{font-size:15.5px;line-height:1.55;margin-top:0}
.evopt{display:block;width:100%;text-align:left;padding:10px 14px;margin-top:8px;background:linear-gradient(#f3ead0,#d9c9a0);border:1px solid #7d6733;border-radius:4px;cursor:pointer;color:#2a2112;font-size:14.5px;font-weight:700}
.evopt:hover{background:linear-gradient(#fff6d8,#e8d8a8)}.evopt small{font-weight:400;color:#7a2a1a}
/* inicio */
#loading{position:fixed;inset:0;z-index:500;background:radial-gradient(circle at 50% 40%,#25323c,#0b1015);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s}
#loading.hide{opacity:0;pointer-events:none}
#loading h1{font-family:var(--head);font-size:64px;letter-spacing:.3em;margin:0;color:var(--gold2);text-shadow:0 2px 12px #000}
#loading .lb{width:360px;height:6px;background:#000;border:1px solid var(--goldd);border-radius:4px;overflow:hidden}#loading .lb i{display:block;height:100%;width:30%;background:linear-gradient(90deg,transparent,var(--gold2),transparent);animation:slide 1.2s infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}

/* ===== GENERACIÓN PROCEDURAL DEL MAPA ===== */
const MAP = {};   // se rellena en buildMap()

function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, oct) {
  let a = 0.5, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < (oct || 5); i++) { sum += a * vnoise(x * f, y * f, s + i * 17); norm += a; a *= 0.5; f *= 2.03; }
  return sum / norm;
}
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lonToX = lon => (lon + 180) / 360 * MAP_W;
const latToY = lat => (LAT_TOP - lat) / (LAT_TOP - LAT_BOT) * MAP_H;
const xToLon = x => x / MAP_W * 360 - 180;
const yToLat = y => LAT_TOP - y / MAP_H * (LAT_TOP - LAT_BOT);

function rasterLand() {
  const cv = document.createElement('canvas'); cv.width = MAP_W; cv.height = MAP_H;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, MAP_W, MAP_H);
  const path = (p) => { g.beginPath(); for (let i = 0; i < p.length; i += 2) { const x = lonToX(p[i]), y = latToY(p[i + 1]); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.closePath(); };
  g.fillStyle = '#000';
  LAND_POLYS.forEach(p => { path(p); g.fill(); });
  g.fillStyle = '#fff';
  SEA_POLYS.forEach(p => { path(p); g.fill(); });
  const d = g.getImageData(0, 0, MAP_W, MAP_H).data;
  const land = new Uint8Array(MAP_W * MAP_H);
  for (let i = 0; i < land.length; i++) land[i] = d[i * 4] < 140 ? 1 : 0;
  return land;
}

// Distancia (chamfer) al límite tierra/mar
function chamfer(mask, target) {
  const W = MAP_W, H = MAP_H, N = W * H, INF = 1e6;
  const dist = new Float32Array(N);
  for (let i = 0; i < N; i++) dist[i] = mask[i] === target ? INF : 0;
  const a = 1, b = 1.4142;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; let d = dist[i]; if (d === 0) continue;
    if (x > 0) d = Math.min(d, dist[i - 1] + a);
    if (y > 0) { d = Math.min(d, dist[i - W] + a); if (x > 0) d = Math.min(d, dist[i - W - 1] + b); if (x < W - 1) d = Math.min(d, dist[i - W + 1] + b); }
    dist[i] = d;
  }
  for (let y = H - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) {
    const i = y * W + x; let d = dist[i]; if (d === 0) continue;
    if (x < W - 1) d = Math.min(d, dist[i + 1] + a);
    if (y < H - 1) { d = Math.min(d, dist[i + W] + a); if (x < W - 1) d = Math.min(d, dist[i + W + 1] + b); if (x > 0) d = Math.min(d, dist[i + W - 1] + b); }
    dist[i] = d;
  }
  return dist;
}

function buildHeight(land) {
  const W = MAP_W, H = MAP_H, N = W * H;
  const dLand = chamfer(land, 1);                       // para tierra: distancia al mar
  const dSea = chamfer(land, 0);                        // para mar: distancia a la tierra
  const h = new Float32Array(N);
  const mount = new Float32Array(N);                    // aporte montañoso
  const kx = W / 360, ky = H / (LAT_TOP - LAT_BOT);
  // cordilleras
  MOUNTAINS.forEach(([pts, r, ht]) => {
    for (let s = 0; s < pts.length - 2; s += 2) {
      const ax = pts[s], ay = pts[s + 1], bx = pts[s + 2], by = pts[s + 3];
      const x0 = Math.max(0, Math.floor(lonToX(Math.min(ax, bx) - r * 3))), x1 = Math.min(W - 1, Math.ceil(lonToX(Math.max(ax, bx) + r * 3)));
      const y0 = Math.max(0, Math.floor(latToY(Math.max(ay, by) + r * 3))), y1 = Math.min(H - 1, Math.ceil(latToY(Math.min(ay, by) - r * 3)));
      const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1e-6;

    const x0 = Math.max(0, Math.floor(lonToX(lon - rx * 2))), x1 = Math.min(W - 1, Math.ceil(lonToX(lon + rx * 2)));
    const y0 = Math.max(0, Math.floor(latToY(lat + ry * 2))), y1 = Math.min(H - 1, Math.ceil(latToY(lat - ry * 2)));

function inEllipse(list, lon, lat, wob) {
  for (let k = 0; k < list.length; k++) {
    const e = list[k]; const a = (lon - e[0]) / e[2], b = (lat - e[1]) / e[3];

function buildBiomes(land, h) {
  const W = MAP_W, H = MAP_H, N = W * H;
  const biome = new Uint8Array(N);
  for (let y = 0; y < H; y++) {
    const lat = yToLat(y);
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (!land[i]) continue;
      const lon = xToLon(x);
      const wob = (fbm(x / 40, y / 40, 31, 4) - 0.5) * 0.9;
      const moist = fbm(x / 110, y / 110, 41, 4);
      const alat = Math.abs(lat);
      const hh = h[i];
      let b = BIOME.GRASS;
      if (inEllipse(STEPPES, lon, lat, wob)) b = BIOME.STEPPE;
      if (alat < 62 && moist > 0.55 && b === BIOME.GRASS && alat > 38) b = BIOME.FOREST;
      if (alat >= 52 && alat < 66 && b !== BIOME.STEPPE && moist > 0.4 && lat > 0) b = BIOME.FOREST;
      if (alat > 62 && lat > 0 || (lat < -50)) b = BIOME.TUNDRA;
      if (alat > 74 || (lon < -20 && lon > -75 && lat > 60 && lat < 84 && (lat > 66 || hh > 1))) b = BIOME.SNOW;
      if (inEllipse(JUNGLES, lon, lat, wob)) b = BIOME.JUNGLE;
      if (alat < 6 && moist > 0.42) b = BIOME.JUNGLE;
      if (inEllipse(DESERTS, lon, lat, wob)) b = BIOME.DESERT;
      if (b === BIOME.GRASS && alat < 35 && moist < 0.38) b = BIOME.STEPPE;
      if (b === BIOME.GRASS && alat < 25 && moist > 0.62) b = BIOME.FOREST;
      if (hh > 1.8) b = BIOME.MOUNTAIN;
      if (hh > 3.4 - alat * 0.02) b = BIOME.SNOW;
      biome[i] = b;
    }
  }
  return biome;
}

function buildTerrainColors(land, h, biome) {
  const W = MAP_W, H = MAP_H;
  const tc = new Uint8ClampedArray(W * H * 4);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    const xm = x > 0 ? x - 1 : x, xp = x < W - 1 ? x + 1 : x, ym = y > 0 ? y - 1 : y, yp = y < H - 1 ? y + 1 : y;
    let r, g, b;
    if (land[i]) {
      const c = BIOME_COL[biome[i]];
      const nz = (fbm(x / 6, y / 6, 51, 3) - 0.5) * 26 + (fbm(x / 26, y / 26, 53, 3) - 0.5) * 30;
      r = c[0] + nz; g = c[1] + nz; b = c[2] + nz * 0.8;
      const hh = h[i];
      const mt = smooth(1.1, 2.2, hh), sn = smooth(2.9, 3.8, hh - Math.abs(yToLat(y)) * 0.01);
      const mc = BIOME_COL[BIOME.MOUNTAIN], sc = BIOME_COL[BIOME.SNOW];

      const sh = (h[ym * W + xm] - h[yp * W + xp]) * 55 + (h[ym * W + x] - h[yp * W + x]) * 25;
      const k = 1 + Math.max(-0.4, Math.min(0.4, sh * 0.5));
      r *= k; g *= k; b *= k;
    } else {
      const d = MAP.dSea[i];
      const t = smooth(0, 55, d);
      r = 70 + (22 - 70) * t; g = 128 + (52 - 128) * t; b = 150 + (84 - 150) * t;
      const nz = (fbm(x / 20, y / 20, 61, 3) - 0.5) * 10; r += nz; g += nz; b += nz;
      if (d < 2.2) { r += 30; g += 30; b += 24; }      // espuma costera
    }

  }

}

// Asignación de estados mediante Dijkstra multi-fuente restringido a la tierra
function assignStates(land, h, seeds) {
  const W = MAP_W, H = MAP_H, N = W * H;
  const owner = new Int16Array(N).fill(-1);
  const cost = new Float32Array(N).fill(1e9);
  const wgt = new Float32Array(N);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {

  let hl = new Int16Array(cap);

    hk[p] = k; hi[p] = i; hl[p] = s;
  }
  let popK = 0, popI = 0, popS = 0;
  function pop() {
    popK = hk[0]; popI = hi[0]; popS = hl[0];
    hs--;

      const k = hk[hs], i = hi[hs], s = hl[hs]; let p = 0;
      for (;;) { let c = p * 2 + 1; if (c >= hs) break; if (c + 1 < hs && hk[c + 1] < hk[c]) c++; if (hk[c] >= k) break; hk[p] = hk[c]; hi[p] = hi[c]; hl[p] = hl[c]; p = c; }
      hk[p] = k; hi[p] = i; hl[p] = s;
    }
  }
  seeds.forEach((s, id) => { const i = s.py * W + s.px; cost[i] = 0; owner[i] = id; push(0, i, id); });
  while (hs > 0) {
    pop(); const i = popI, c = popK, s = popS;
    if (c > cost[i]) continue;
    const x = i % W, y = (i / W) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;

  const seen = new Uint8Array(N);

    if (!land[i0] || owner[i0] >= 0 || seen[i0]) continue;

    stack[sp++] = i0; seen[i0] = 1;
    while (sp) {
      const i = stack[--sp]; comp.push(i); const x = i % W, y = (i / W) | 0; cnt++; sx += x; sy += y;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const j = ny * W + nx; if (land[j] && owner[j] < 0 && !seen[j]) { seen[j] = 1; stack[sp++] = j; }

    const cx = sx / cnt, cy = sy / cnt; let best = 0, bd = 1e12;
    seeds.forEach((s, id) => { const d = (s.px - cx) ** 2 + (s.py - cy) ** 2; if (d < bd) { bd = d; best = id; } });
    for (let k = 0; k < comp.length; k++) owner[comp[k]] = best;
  }

}

function buildMap() {
  const t0 = performance.now();
  const W = MAP_W, H = MAP_H, N = W * H;
  const land = rasterLand();
  MAP.land = land;
  const h = buildHeight(land);
  MAP.height = h;
  MAP.biome = buildBiomes(land, h);
  MAP.terrainCol = buildTerrainColors(land, h, MAP.biome);

  // semillas de estados
  const lines = STATE_DATA.split('\n');
  const seeds = [];
  lines.forEach(line => {
    const f = line.split('|');
    let px = Math.round(lonToX(+f[1])), py = Math.round(latToY(+f[2]));
    px = Math.max(0, Math.min(W - 1, px)); py = Math.max(0, Math.min(H - 1, py));
    if (!land[py * W + px]) {
      let found = false;
      for (let r = 1; r < 60 && !found; r++) {
        for (let dy = -r; dy <= r && !found; dy++) for (let dx = -r; dx <= r && !found; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
          const x = px + dx, y = py + dy; if (x < 0 || y < 0 || x >= W || y >= H) continue;
          if (land[y * W + x]) { px = x; py = y; found = true; }
        }
      }
      if (!found) console.warn('Estado sin tierra:', f[0]);
    }
    seeds.push({name: f[0], px, py, owner: f[3], pop: +f[4] || 0, res: f[5] || ''});
  });
  MAP.seeds = seeds;
  MAP.stateOf = assignStates(land, h, seeds);

  // métricas por estado
  const S = seeds.length;
  const st = seeds.map(() => ({area: 0, sx: 0, sy: 0, x0: W, x1: 0, y0: H, y1: 0, biomes: new Float32Array(9), coast: 0, neigh: new Set()}));
  const so = MAP.stateOf;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (!land[i]) continue;
    const s = st[so[i]]; s.area++; s.sx += x; s.sy += y;
    if (x < s.x0) s.x0 = x; if (x > s.x1) s.x1 = x; if (y < s.y0) s.y0 = y; if (y > s.y1) s.y1 = y;
    s.biomes[MAP.biome[i]]++;
    if (MAP.dLand[i] < 2.5) s.coast++;
    if (x < W - 1 && land[i + 1] && so[i + 1] !== so[i]) { s.neigh.add(so[i + 1]); st[so[i + 1]].neigh.add(so[i]); }
    if (y < H - 1 && land[i + W] && so[i + W] !== so[i]) { s.neigh.add(so[i + W]); st[so[i + W]].neigh.add(so[i]); }
  }
  MAP.stats = st;
  // listas de píxeles por estado
  const off = new Int32Array(S + 1);
  for (let s = 0; s < S; s++) off[s + 1] = off[s] + st[s].area;
  const pos = off.slice(0, S), order = new Int32Array(off[S]);
  for (let i = 0; i < N; i++) if (land[i]) order[pos[so[i]]++] = i;
  MAP.pixOff = off; MAP.pixOrder = order;
  MAP.edge = new Uint8Array(N);
  buildProvinces();
  console.log('Mapa generado en', Math.round(performance.now() - t0), 'ms; estados:', S);

// Bordes de estado (1) y de país (2). owners: array estado->id de país (0 = sin dueño)
function computeEdges(ownerOf) {
  const W = MAP_W, H = MAP_H, land = MAP.land, so = MAP.stateOf, e = MAP.edge;
  e.fill(0);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (!land[i]) continue;
    const a = so[i];
    if (x < W - 1 && land[i + 1]) { const b = so[i + 1]; if (a !== b) { const t = ownerOf[a] !== ownerOf[b] ? 2 : 1; if (t > e[i]) e[i] = t; if (t > e[i + 1]) e[i + 1] = t; } }
    if (y < H - 1 && land[i + W]) { const b = so[i + W]; if (a !== b) { const t = ownerOf[a] !== ownerOf[b] ? 2 : 1; if (t > e[i]) e[i] = t; if (t > e[i + W]) e[i + W] = t; } }
  }
}


// Distancia normalizada (0 = entrada del invasor, 1 = fondo del estado) para dibujar el frente de guerra
function computeFrontRank(sid, sideTags) {
  if (!MAP.pxRank) { MAP.pxRank = new Float32Array(MAP_W * MAP_H).fill(-1); MAP.rankFor = {}; }
  const key = [...sideTags].sort().join(',');
  if (MAP.rankFor[sid] === key) return;
  const W = MAP_W, so = MAP.stateOf, land = MAP.land, rank = MAP.pxRank;
  const off = MAP.pixOff, ord = MAP.pixOrder;
  const n = off[sid + 1] - off[sid]; if (!n) return;
  const owner = G.S.map(s => s.owner);
  const dist = new Int32Array(n).fill(-1);
  const idxOf = new Map(); for (let k = 0; k < n; k++) idxOf.set(ord[off[sid] + k], k);
  const queue = new Int32Array(n); let qh = 0, qt = 0;
  const nb = [1, -1, W, -W];
  for (let k = 0; k < n; k++) {
    const i = ord[off[sid] + k]; let seed = false;
    for (let d = 0; d < 4 && !seed; d++) { const j = i + nb[d]; if (j < 0 || j >= land.length || !land[j]) continue; const t = so[j]; if (t !== sid && sideTags.has(owner[t])) seed = true; }
    if (seed) { dist[k] = 0; queue[qt++] = k; }
  }
  if (qt === 0) { // sin frontera terrestre: desembarco desde la costa
    for (let k = 0; k < n; k++) if (MAP.dLand[ord[off[sid] + k]] < 3) { dist[k] = 0; queue[qt++] = k; }
  }
  if (qt === 0) { for (let k = 0; k < n; k++) { dist[k] = 0; queue[qt++] = k; } }
  const nb8 = [1, -1, W, -W, W + 1, W - 1, -W + 1, -W - 1];
  let mx = 1;
  while (qh < qt) {
    const k = queue[qh++]; const i = ord[off[sid] + k];
    for (let d = 0; d < 8; d++) { const j = i + nb8[d]; const kk = idxOf.get(j); if (kk !== undefined && dist[kk] < 0) { dist[kk] = dist[k] + 1; if (dist[kk] > mx) mx = dist[kk]; queue[qt++] = kk; } }
  }
  for (let k = 0; k < n; k++) rank[ord[off[sid] + k]] = (dist[k] < 0 ? mx : dist[k]) / mx;
  MAP.rankFor[sid] = key;
}

/* ===== PROVINCIAS: subdivisión de cada estado para mover tropas ===== */
// Datos estáticos en MAP.provs / MAP.provOf; datos dinámicos (ocupación, fortificación) en G.P.
const NOPROV = 65535;
const OCC_DAYS = 5;            // días que debe mantenerse una provincia sin defensores para ocuparla

function buildProvinces() {
  const t0 = performance.now();
  const W = MAP_W, H = MAP_H, N = W * H, land = MAP.land, so = MAP.stateOf;
  const provOf = new Uint16Array(N).fill(NOPROV);
  const provs = [];
  const off = MAP.pixOff, ord = MAP.pixOrder;
  const nb8 = [1, -1, W, -W, W + 1, W - 1, -W + 1, -W - 1];
  const queue = new Int32Array(N);
  for (let sid = 0; sid < MAP.stats.length; sid++) {
    const st = MAP.stats[sid], n = off[sid + 1] - off[sid]; if (!n) continue;
    const want = clamp(Math.round(n / 650), 2, 9);
    // muestra de píxeles para elegir semillas (farthest-point + Lloyd)
    const step = Math.max(1, Math.floor(n / 500)), sample = [];
    for (let k = 0; k < n; k += step) { const i = ord[off[sid] + k]; sample.push([i % W, (i / W) | 0]); }
    const cx = st.sx / st.area, cy = st.sy / st.area;
    let first = sample[0], bd = 1e18; sample.forEach(p => { const d = (p[0] - cx) ** 2 + (p[1] - cy) ** 2; if (d < bd) { bd = d; first = p; } });
    let seeds = [first];
    const md = sample.map(p => (p[0] - first[0]) ** 2 + (p[1] - first[1]) ** 2);
    while (seeds.length < want && seeds.length < sample.length) {
      let bi = 0, bv = -1; md.forEach((v, i) => { if (v > bv) { bv = v; bi = i; } });
      const p = sample[bi]; seeds.push(p);
      sample.forEach((q, i) => { const d = (q[0] - p[0]) ** 2 + (q[1] - p[1]) ** 2; if (d < md[i]) md[i] = d; });
    }
    for (let it = 0; it < 3; it++) {
      const sx = seeds.map(() => 0), sy = seeds.map(() => 0), sn = seeds.map(() => 0);
      sample.forEach(q => { let b = 0, v = 1e18; seeds.forEach((p, j) => { const d = (q[0] - p[0]) ** 2 + (q[1] - p[1]) ** 2; if (d < v) { v = d; b = j; } }); sx[b] += q[0]; sy[b] += q[1]; sn[b]++; });
      seeds = seeds.map((p, j) => { if (!sn[j]) return p; const mx = sx[j] / sn[j], my = sy[j] / sn[j]; let bp = p, bv = 1e18; sample.forEach(q => { const d = (q[0] - mx) ** 2 + (q[1] - my) ** 2; if (d < bv) { bv = d; bp = q; } }); return bp; });
    }
    // reparto por anchura (BFS multifuente dentro del estado)
    const base = provs.length; let qh = 0, qt = 0;
    const uniq = new Set();
    seeds.forEach(p => { const i = p[1] * W + p[0]; if (uniq.has(i)) return; uniq.add(i); provs.push({s: sid}); provOf[i] = provs.length - 1; queue[qt++] = i; });
    while (qh < qt) {
      const i = queue[qh++], p = provOf[i], x = i % W;
      for (let d = 0; d < 8; d++) {
        const dx = d === 0 || d === 4 || d === 6 ? 1 : d === 1 || d === 5 || d === 7 ? -1 : 0;
        if ((x === 0 && dx < 0) || (x === W - 1 && dx > 0)) continue;
        const j = i + nb8[d]; if (j < 0 || j >= N || !land[j] || so[j] !== sid || provOf[j] !== NOPROV) continue;
        provOf[j] = p; queue[qt++] = j;
      }
    }
    // componentes sin semilla (islas): provincia propia
    for (let k = off[sid]; k < off[sid + 1]; k++) {
      const i0 = ord[k]; if (provOf[i0] !== NOPROV) continue;
      provs.push({s: sid}); const p = provs.length - 1; provOf[i0] = p; qh = 0; qt = 0; queue[qt++] = i0;
      while (qh < qt) {
        const i = queue[qh++], x = i % W;
        for (let d = 0; d < 8; d++) {
          const dx = d === 0 || d === 4 || d === 6 ? 1 : d === 1 || d === 5 || d === 7 ? -1 : 0;
          if ((x === 0 && dx < 0) || (x === W - 1 && dx > 0)) continue;
          const j = i + nb8[d]; if (j < 0 || j >= N || !land[j] || so[j] !== sid || provOf[j] !== NOPROV) continue;
          provOf[j] = p; queue[qt++] = j;
        }
      }
    }
    st.provs = []; for (let p = base; p < provs.length; p++) st.provs.push(p);
  }
  // métricas y adyacencia
  const P = provs.length;
  provs.forEach((p, id) => { p.id = id; p.area = 0; p.sx = 0; p.sy = 0; p.biomes = new Float32Array(9); p.coast = 0; p.nb = new Set(); });
  const pnb = new Uint16Array(N).fill(NOPROV), pedge = new Uint8Array(N);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (!land[i]) continue;

// camino A* entre provincias. canStep(from,to) decide si se puede entrar; cost(from,to) en días
function pathProvs(from, to, canStep, cost, limit) {
  if (from === to) return [];
  const P = MAP.provs, g = new Map([[from, 0]]), prev = new Map();
  const heap = [[0, from]]; const done = new Set(); let n = 0;
  const push = it => { heap.push(it); let i = heap.length - 1; while (i > 0) { const q = (i - 1) >> 1; if (heap[q][0] <= heap[i][0]) break; [heap[q], heap[i]] = [heap[i], heap[q]]; i = q; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { let c = i * 2 + 1; if (c >= heap.length) break; if (c + 1 < heap.length && heap[c + 1][0] < heap[c][0]) c++; if (heap[c][0] >= heap[i][0]) break; [heap[c], heap[i]] = [heap[i], heap[c]]; i = c; } } return top; };
  heap.length = 0; push([provDist(from, to) * 2, from]);
  while (heap.length) {
    const [, u] = pop(); if (done.has(u)) continue; done.add(u);
    if (u === to) break; if (++n > (limit || 4000)) break;
    for (const v of P[u].nb) {
      if (done.has(v) || !canStep(u, v)) continue;
      const nd = g.get(u) + cost(u, v);
      if (nd < (g.get(v) ?? 1e9)) { g.set(v, nd); prev.set(v, u); push([nd + provDist(v, to) * 2, v]); }
    }
  }
  if (!prev.has(to)) return null;
  const path = []; let cur = to; while (cur !== from) { path.unshift(cur); cur = prev.get(cur); }
  return path;
}

function computeCaps() {
  const S = G.S;
  let pop = 0; S.forEach(s => pop += s.popBase * 1000);
  const D = {}; GOODS.forEach(g => D[g.id] = 0);
  const afford = [1, 1, 1, 0.95, 0.9, 0.85, 0.7, 0.7, 0.7, 0.55, 0.5, 0.45, 0.4, 0.4, 0.4];
  const lv = {};
  for (let it = 0; it < 8; it++) {
    const need = {}; GOODS.forEach(g => need[g.id] = 0);
    LADDER.forEach((l, i) => need[l.g] += pop * l.q * afford[i]);
    BUILDINGS.forEach(b => { if (b.out && lv[b.id]) for (const g in b.inputs) need[g] += lv[b.id] * b.inputs[g]; });
    BUILDINGS.forEach(b => { if (b.out) lv[b.id] = need[b.out] / b.outAmt; });
  }
  G.needLevels = lv;
  // pesos
  const W = {}; BUILDINGS.forEach(b => W[b.id] = new Float32Array(S.length));
  const cosl = s => Math.cos(yToLat(MAP.stats[s.id].sy / Math.max(1, MAP.stats[s.id].area)) * Math.PI / 180);
  let maxPop = 0, sumPop = 0; S.forEach(s => { sumPop += s.popBase; });
  const arAreaTot = S.reduce((a, s) => a + areaWeight(s, ARABLE_F) * cosl(s), 0);
  S.forEach((s, i) => {
    const c = G.C[s.owner]; const ind = c.ind;
    const cl = cosl(s);
    const arable = 0.5 * areaWeight(s, ARABLE_F) * cl / arAreaTot * sumPop + 0.5 * s.popBase;
    const pasture = areaWeight(s, PASTURE_F) * cl;
    const forest = areaWeight(s, FOREST_F) * cl;
    const coast = Math.pow(MAP.stats[s.id].coast, 0.85);
    W.farm[i] = arable * (1 + 0.35 * (s.res.g || 0)) * (s.res.g ? 1 : 1);
    W.ranch[i] = pasture * (1 + 0.5 * (s.res.m || 0)) + 0.1 * s.popBase;
    W.fishing[i] = coast * (1 + 0.6 * (s.res.f || 0));
    W.logging[i] = forest * (1 + 0.5 * (s.res.w || 0));
    W.iron[i] = (s.res.i || 0); W.coal[i] = (s.res.c || 0);
    W.fruit[i] = (s.res.F || 0); W.sugar[i] = (s.res.U || 0); W.tea[i] = (s.res.T || 0); W.coffee[i] = (s.res.C || 0); W.tobacco[i] = (s.res.B || 0); W.fibers[i] = (s.res.u || 0) + 0.02 * pasture / 100;
    const indW = Math.pow(s.popBase, 1.4) * (0.25 + 3 * ind);
    ['textile', 'clothes', 'furniture', 'liquor'].forEach(k => W[k][i] = indW);
    W.tools[i] = indW * (1 + 0.4 * ((s.res.i || 0) + (s.res.c || 0)) / 4);
    W.steel[i] = indW * (1 + 0.5 * ((s.res.i || 0) + (s.res.c || 0)) / 3);
    W.constr[i] = Math.ceil(s.popBase / 500 + 1) * (0.3 + 2 * ind);
    W.railway[i] = Math.ceil(s.popBase / 900 + 1) * (0.4 + 2 * ind);
    W.admin[i] = W.barracks[i] = W.university[i] = Math.ceil(s.popBase / 450 + 1);
  });

  BUILDINGS.forEach(b => {
    const w = W[b.id]; let tot = 0; for (let i = 0; i < w.length; i++) tot += w[i];
    S.forEach((s, i) => {

      if (K[b.id]) cap = tot > 0 ? (lv[b.id] || 1) * K[b.id] * w[i] / tot : 0;
      else cap = w[i];

  S.forEach(s => {
    BUILDINGS.forEach(b => {

      else s.b[b.id] = 0;

}

  G.S.forEach(s => G.C[s.owner].states.push(s.id));
  refreshOwnerOf();
  if (d.v2 !== 2) initArmies();
  G.paused = true;
  return d;
}

/* ---------- ticks ---------- */
function advanceDay() {
  const d = G.date;
  d.t++; d.d++;
  const dim = DAYS_IN_MONTH[d.m] + (d.m === 1 && isLeap(d.y) ? 1 : 0);
  let monthly = false;
  if (d.d > dim) { d.d = 1; d.m++; monthly = true; if (d.m > 11) { d.m = 0; d.y++; } }
  econDay();
  militaryDay();
  if (d.t % 2 === 0) aiMilitary();
  if (monthly) monthlyTick();
  dailyEvents();
}
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;

function warmUp() {
  for (let w = 0; w < 300; w++) {
    weeklyTick(true); GOODS.forEach(g => { const hh = G.hist[g.id]; if (w % 2 === 0) { hh.push(G.price[g.id]); if (hh.length > 220) hh.shift(); } });
    if (w % 4 === 3) { realloc(true); }
  }
  // redondear niveles
  const sr = x => { const f = Math.floor(x); return f + (Math.random() < x - f ? 1 : 0); };
  G.S.forEach(s => { BUILDINGS.forEach(b => { s.b[b.id] = sr(s.b[b.id] || 0); }); });
  for (let w = 0; w < 30; w++) { weeklyTick(false); if (w % 4 === 3) realloc(true); }
  monthlyTick(true);
}

function stateStaffing(s, c) {
  const jobs = {}, mixJobs = {};
  for (const p in PROFS) jobs[p] = 0;
  BUILDINGS.forEach(b => {
    const L = s.b[b.id]; if (!L) return;
    const w = L * b.workersPerLevel * (b.out ? (s.ut[b.id] ?? 1) : 1);
    for (const p in b.workers) jobs[p] += w * b.workers[p];
  });
  s.jobs = jobs;
  const fill = {};
  for (const p in jobs) {
    const avail = (s.pops[p] || 0) * WF;
    fill[p] = jobs[p] > 0 ? Math.min(1, avail / jobs[p]) : 1;
  }
  s.fill = fill;
  BUILDINGS.forEach(b => {
    let st = 0; for (const p in b.workers) st += b.workers[p] * fill[p];
    s.stg[b.id] = st;
  });
}

/* ---------- economía por fases (se reparte a lo largo de la semana) ---------- */
let ECX = null;
const DIFF = {
  1: {name: 'Relajada', crisis: 0.5, cost: 0.8, tax: 1.06, rate: 0.7, vol: 0.85},
  2: {name: 'Normal', crisis: 1, cost: 1.25, tax: 1, rate: 1, vol: 1},
  3: {name: 'Difícil', crisis: 1.7, cost: 1.7, tax: 0.93, rate: 1.5, vol: 1.15},
  4: {name: 'Brutal', crisis: 2.6, cost: 2.3, tax: 0.85, rate: 2.2, vol: 1.3}
};
const FX_KEYS = ['demand', 'agri', 'ind', 'mine', 'invest', 'credit'];
function diffP() { return DIFF[G.diff || 2]; }

function recalcFx() {
  const fx = {}; FX_KEYS.forEach(k => fx[k] = 1);
  const ph = G.week / 52 / 9 * Math.PI * 2 + 1;
  G.cycle = Math.sin(ph);
  fx.demand *= 1 + 0.05 * G.cycle;
  const cf = {};
  G.tags.forEach(t => { cf[t] = {}; FX_KEYS.forEach(k => cf[t][k] = 1); });
  (G.crises || []).forEach(cr => {
    if (cr.scope === 'global') G.tags.forEach(t => { const sev = t === NONE ? 1 : crisisSeverity(G.C[t]); for (const k in cr.fx) cf[t][k] *= 1 + (cr.fx[k] - 1) * sev; });
    else { const tgt = cf[cr.scope]; if (tgt) for (const k in cr.fx) tgt[k] *= (cr.fx[k] < 1 && cr.type !== 'aid') ? 1 + (cr.fx[k] - 1) * crisisSeverity(G.C[cr.scope]) : cr.fx[k]; }
  });
  G.fx = fx;
  G.tags.forEach(t => { G.C[t].fx = cf[t]; });
}

function econBegin(warm) {
  G.week++;
  recalcFx();
  const D = {}, P = {}; GOODS.forEach(g => { D[g.id] = 0; P[g.id] = 0; });
  const cstat = {};
  G.tags.forEach(t => cstat[t] = {gdp: 0, tax: 0, ctax: 0, wages: 0, govPay: 0, ownerInc: 0, pop: 0, soldiers: 0, popSol: 0, employed: 0, workers: 0, indLevels: 0, bur: 0, constr: 0, inn: 0, spent: 0, invest: 0});
  ECX = {D, P, R: null, cstat, utTarget: {}, warm};
}

// Fase A: personal, demanda de insumos y planes de consumo
function econA(i0, i1) {
  const S = G.S, price = G.price, D = ECX.D, C = G.C;
  for (let si = i0; si < i1; si++) {
    const s = S[si];
    const c = C[s.owner];
    stateStaffing(s, c);
    const dm = G.fx.demand * c.fx.demand;
    const taxR = TAX_LEVELS[c.taxLevel] * (s.owner === NONE ? 0 : c.stats.taxEff);
    const ctax = 1 + (s.owner === NONE ? 0 : c.consTax * 0.04 * c.stats.taxEff);
    BUILDINGS.forEach(b => {
      const L = s.b[b.id]; if (!L || !b.out) return;
      const stg = s.stg[b.id] * (s.ut[b.id] ?? 1);
      for (const g in b.inputs) D[g] += L * b.inputs[g] * stg;
    });
    const plan = {};
    for (const p in s.pops) {
      const N = s.pops[p]; if (N <= 0) continue;
      let budget = (s.inc[p] || 0) * (1 - taxR) * dm;
      const svc = Math.min(budget * 0.12, budget);
      budget -= svc;
      const items = [];
      const mult = PROFS[p].cons;
      for (let i = 0; i < LADDER.length; i++) {
        const l = LADDER[i];
        const want = N * l.q * mult;
        const cost = want * price[l.g] * ctax;
        let frac = 1;
        if (budget >= cost) budget -= cost; else { frac = cost > 0 ? budget / cost : 0; budget = 0; }
        items.push({g: l.g, want, buy: want * frac});
        D[l.g] += want * frac;
        if (frac < 1) { for (let j = i + 1; j < LADDER.length; j++) items.push({g: LADDER[j].g, want: N * LADDER[j].q * mult, buy: 0}); break; }
      }
      plan[p] = {items, left: budget, svc, b0: budget};
    }
    s.plan = plan; s.ctax = ctax; s.taxR = taxR;
  }
}

// Fase intermedia: racionamiento por escasez
function econMid() {
  const D = ECX.D, price = G.price;
  const R = {};
  GOODS.forEach(g => {
    const A = G.avail[g.id] === undefined ? D[g.id] : G.avail[g.id];
    R[g.id] = D[g.id] > 0 ? Math.min(1, A / D[g.id]) : 1;
    if (!isFinite(R[g.id])) R[g.id] = 1;
  });
  G.ratio = R; G.dem = D; ECX.R = R;
  BUILDINGS.forEach(b => { if (!b.out) return; let iv = 0; for (const g in b.inputs) iv += b.inputs[g] * price[g]; const va = b.outAmt * price[b.out] - iv; const r = va / (VA_PER_WORKER * b.workersPerLevel); ECX.utTarget[b.id] = r <= 0.05 ? 0.45 : clamp(Math.pow(r, 0.7), 0.45, 1.35); });
}

// Fase B: producción, salarios, beneficios y consumo efectivo
function econB(i0, i1) {
  const S = G.S, price = G.price, C = G.C, R = ECX.R, P = ECX.P, cstat = ECX.cstat, utTarget = ECX.utTarget, D = ECX.D;
  for (let si = i0; si < i1; si++) {
    const s = S[si];
    const c = C[s.owner], cs = cstat[s.owner], m = c.mods;
    const incNext = {}; PROF_ORDER.forEach(p => incNext[p] = (s.extra && s.extra[p]) || 0); s.extra = {};
    let gdp = 0, empTot = 0;
    const radPen = 1 - 0.12 * c.radicals;
    const infraM = 1 + Math.min(0.3, (s.b.railway || 0) * 0.05) + m.infra;
    const labShare = clamp(0.65 + (m.lab || 0), 0.4, 0.85);
    const fxA = G.fx.agri * c.fx.agri * (s.occ ? 1 - 0.6 * s.occ : 1), fxM = G.fx.mine * c.fx.mine * (s.occ ? 1 - 0.6 * s.occ : 1), fxI = G.fx.ind * c.fx.ind * (s.occ ? 1 - 0.6 * s.occ : 1);
    BUILDINGS.forEach(b => {
      const L = s.b[b.id]; if (!L) return;
      const utb = b.out ? (s.ut[b.id] ?? 1) : 1;
      const stg = s.stg[b.id];
      const jobsW = L * b.workersPerLevel * utb;
      if (b.gov || !b.out) {
        const emp = jobsW * stg;
        if (b.gov) {
          const w = Math.max(2.4, c.stats.avgWage) * 1.05;
          const pay = emp * w * (b.id === 'barracks' ? c.milFund * (1 + (c.mods.milCost || 0)) : b.id === 'university' ? c.eduFund : 1);
          for (const p in b.workers) incNext[p] += pay * b.workers[p];
          cs.govPay += pay;
          if (b.id === 'admin') cs.bur += L * b.bur * stg;
          if (b.id === 'barracks') cs.soldiers += jobsW * b.workers.soldiers * stg;
          if (b.id === 'university') cs.inn += L * b.inn * stg;
        } else {
          const w = Math.max(2.4, c.stats.avgWage) * 0.9;
          const pay = jobsW * stg * w;
          for (const p in b.workers) incNext[p] += pay * b.workers[p];
          cs.spent += pay;
          if (b.id === 'constr') cs.constr += L * b.ctr * stg;
          if (b.id === 'railway') s.infra = L;
        }
        empTot += jobsW * stg;
        return;
      }
      let rmin = 1;
      for (const g in b.inputs) rmin = Math.min(rmin, R[g]);
      const grp = b.grp;
      const techM = (grp === 'Agricultura' || grp === 'Plantaciones') ? (1 + m.agriOut) * fxA : (grp === 'Extracción' ? (1 + m.mineOut) * fxM : (1 + m.indOut + (b.id === 'steel' ? (m.steelOut || 0) : 0)) * fxI);
      const eff = stg * rmin * utb;
      const outQ = L * b.outAmt * eff * techM * infraM * (1 + (m.out || 0)) * radPen;
      let inCost = 0;
      for (const g in b.inputs) inCost += L * b.inputs[g] * eff * price[g];
      P[b.out] += outQ;
      s.ut[b.id] = utb + (utTarget[b.id] - utb) * 0.07;
      const rev = outQ * price[b.out];
      const va = rev - inCost;
      const emp = jobsW * stg;
      const wagePool = Math.max(0, va) * labShare;
      const owners = Math.max(0, va) * (1 - labShare);
      const wage = emp > 0 ? wagePool / emp : 0;
      for (const p in b.workers) incNext[p] += wage * emp * b.workers[p];
      empTot += emp;
      const agri = grp === 'Agricultura' || grp === 'Plantaciones' || b.id === 'logging';
      incNext.aristocrats += owners * (agri ? 0.75 : 0.2);
      incNext.capitalists += owners * (agri ? 0.25 : 0.8);
      cs.ownerInc += owners;
      gdp += va;
      s.bva = s.bva || {}; s.bva[b.id] = va / L;
      s.bwage = s.bwage || {}; s.bwage[b.id] = wage;
      cs.wages += wagePool;
    });
    let svcTotal = 0;
    for (const p in s.plan) {
      const pl = s.plan[p];
      let spent = 0, sol = 0;
      pl.items.forEach((it, i) => {
        const got = it.buy * R[it.g];
        spent += got * price[it.g] * s.ctax;
        const frac = it.want > 0 ? got / it.want : 1;
        sol += LADDER[i].w * Math.min(1, frac);
        cs.ctax += got * price[it.g] * (s.ctax - 1);
      });
      s.sol[p] = 25 * sol / LADDER_W;
      const leftover = Math.max(0, pl.b0 - spent);
      const sv = (p === 'aristocrats' || p === 'capitalists') ? 0.25 : 0;
      cs.invest += leftover * sv;
      svcTotal += pl.svc + leftover * (1 - sv);
    }
    incNext.shopkeepers += svcTotal * 0.45; incNext.clerks += svcTotal * 0.25; incNext.clergy += svcTotal * 0.10; incNext.laborers += svcTotal * 0.20;
    gdp += svcTotal;
    let unemp = 0, unU = 0;
    for (const p of ['peasants', 'laborers', 'machinists']) {
      const avail = (s.pops[p] || 0) * WF;
      const used = Math.min(avail, s.jobs[p] || 0);
      const un = avail - used;
      unemp += un; if (p !== 'peasants') unU += un;
      incNext[p] += un * (p === 'peasants' ? 1.2 : 0.7);
    }
    s.unemp = unemp; s.unempU = unU; s.employed = empTot;
    s.gdp = gdp; cs.gdp += gdp;
    for (const p in incNext) { s.inc[p] = s.inc[p] * 0.55 + incNext[p] * 0.45; if (!isFinite(s.inc[p])) s.inc[p] = 0; }
    let tot = 0, solsum = 0;
    for (const p in s.pops) { tot += s.pops[p]; solsum += s.pops[p] * s.sol[p]; }
    s.solAvg = tot ? solsum / tot : 0;
    let taxIn = 0; for (const p in incNext) taxIn += incNext[p];
    const occK = s.occ ? 1 - s.occ : 1;
    cs.tax += taxIn * s.taxR * occK;
    cs.pop += tot; cs.popSol += solsum;
    s.taxPaid = taxIn * s.taxR;
    cs.indLevels += (s.b.textile || 0) + (s.b.clothes || 0) + (s.b.furniture || 0) + (s.b.tools || 0) + (s.b.liquor || 0) + (s.b.steel || 0);
  }
}

// Fase C: precios, inventarios y presupuesto de los países
function econEnd() {
  const S = G.S, price = G.price, C = G.C, D = ECX.D, P = ECX.P, cstat = ECX.cstat, warm = ECX.warm;
  const vol = warm ? 1 : diffP().vol;
  if (!G.pt) G.pt = {};
  GOODS.forEach(g => {
    const A = G.avail[g.id] === undefined ? D[g.id] : G.avail[g.id];
    const ratio = D[g.id] / Math.max(A, 1e-6);
    let pr = (G.pt[g.id] ?? price[g.id]) * (1 + 0.06 * vol * clamp(ratio - 1, -0.45, 0.9));
    pr += (g.base - pr) * 0.012;
    const tgt = clamp(pr, g.base * 0.35, g.base * 3.2);
    G.pt[g.id] = tgt;
    if (warm) price[g.id] = tgt;
    const surplus = Math.max(0, A - D[g.id]);
    G.stock[g.id] = surplus * 0.2;
    G.avail[g.id] = P[g.id] + G.stock[g.id];
    G.prod[g.id] = P[g.id];
  });
  if (warm) {
    let mp = 0; GOODS.forEach(g => mp += Math.min(1.5, price[g.id] / g.base)); mp /= GOODS.length;
    if (mp > 0.95) S.forEach(s => { const Pp = popTotal(s); const u = s.unemp / Math.max(1, Pp * WF); if (u > 0.06) { const k = 1 + 0.008 * Math.min(1, u * 1.5); BUILDINGS.forEach(b => { if (b.out && s.b[b.id] > 0 && !b.tech) s.b[b.id] = Math.min(s.cap[b.id], s.b[b.id] * k); }); } });
    BUILDINGS.forEach(b => { if (!b.out) return; const f = clamp(Math.pow(D[b.out] / Math.max(P[b.out], 1), 0.35), 0.94, 1.05); S.forEach(s => { if (s.b[b.id] > 0) s.b[b.id] = Math.min(s.cap[b.id], s.b[b.id] * f); }); });
  }
  const dp = diffP();
  G.tags.forEach(t => {
    const c = C[t], cs = cstat[t];
    const st = c.stats;
    st.pop = cs.pop; st.gdp = cs.gdp; st.soldiers = cs.soldiers; st.indLevels = cs.indLevels;
    st.sol = cs.pop ? cs.popSol / cs.pop : 0;
    st.constr = (t === NONE ? 0 : 12 + cs.constr) * (1 + c.mods.constr);
    st.bur = cs.bur * (1 + c.mods.bur) + 100;
    st.burNeed = Math.max(1, cs.pop / 1000 * 0.25);
    const eff = clamp(st.bur / st.burNeed, 0.2, 1);
    const dtx = c.ai || warm ? 1 : dp.tax;
    st.taxEff = t === NONE ? 0 : clamp((0.4 + 0.6 * eff) * (1 + c.mods.tax) * dtx * (1 - (c.tradeLoss || 0)), 0.2, 1);
    st.avgWage = cs.wages > 0 && cs.pop > 0 ? clamp(cs.wages / (cs.pop * WF), 2.4, 12) : 3.5;
    st.innovRate = (1.5 + (c.lit / 100) * 20 * (1 + 0.25 * Math.log(1 + cs.pop / 1e6)) + 3 * Math.sqrt(Math.min(cs.inn * c.eduFund, 30))) * (1 + c.mods.innov) * (c.fx.invest < 0.6 ? 0.9 : 1);
    const income = (cs.tax + cs.ctax) * (1 + diploIncomeBonus(c));
    const expense = cs.govPay;
    st.income = income; st.expense = expense;
    c.budget = {income: {tax: cs.tax, ctax: cs.ctax}, expense: {gov: cs.govPay}};
    if (t === NONE) return;
    let spentCon = govConstruct(c, st.constr, warm);
    c.budget.expense.constr = spentCon;
    const subs = warm ? 0 : pactMoneyFlows(c);
    c.budget.expense.subs = subs;
    const free = income - expense - spentCon - subs;
    const pub = warm ? Math.max(0, free) : (free > 0 && c.treasury > -c.stats.income * 8 ? free * 0.85 : 0);
    c.budget.expense.pub = pub;
    spreadPublic(c, pub);
    c.treasury += free - pub;
    if (c.treasury < 0) { c.debt = -c.treasury; } else c.debt = 0;
    const rate = 0.0006 * dp.rate * c.fx.credit * G.fx.credit * (1 + (c.debt / Math.max(1, income)) / 40);
    const interest = c.debt * rate;
    if (interest && !warm) { c.treasury -= interest; c.budget.expense.interest = interest; }
    c.investPool += cs.invest * 0.9 * G.fx.invest * c.fx.invest;
    privateInvest(c, warm);
    c.innovStock = (c.innovStock || 0) + st.innovRate;
    c.influence = Math.min(500, c.influence + 0.4 + c.prestige / 400);
    researchStep(c, warm);
  });
  ECX = null;
}

function weeklyTick(warm) {
  econBegin(warm);
  const N = G.S.length;
  econA(0, N); econMid(); econB(0, N); econEnd();
  if (!warm) for (const g in G.pt) G.price[g] = G.pt[g];
}

// Planificación diaria: la semana se reparte en etapas y los precios se suavizan día a día
function econDay() {
  const dow = G.date.t % 7, N = G.S.length, h = N >> 1;
  switch (dow) {
    case 0: econBegin(false); econA(0, h); break;
    case 1: if (ECX) econA(h, N); break;
    case 2: if (ECX) econMid(); break;
    case 3: if (ECX) econB(0, h); break;
    case 4: if (ECX) econB(h, N); break;
    case 5: if (ECX) { econEnd(); G.weekDone = true; } break;
    case 6: warWeek(); break;
  }
  if (G.pt) for (const g in G.pt) G.price[g] += (G.pt[g] - G.price[g]) * 0.3;
  if (dow % 3 === 0) GOODS.forEach(g => { const hh = G.hist[g.id]; hh.push(G.price[g.id]); if (hh.length > 220) hh.shift(); });
}

function spreadPublic(c, amt) {
  if (amt <= 0 || !c.states.length) return;
  let tot = 0; c.states.forEach(i => tot += popTotal(G.S[i]));
  if (tot <= 0) return;
  c.states.forEach(i => { const s = G.S[i]; for (const p in s.pops) { if (p === 'aristocrats' || p === 'capitalists') continue; addExtra(s, p, amt * s.pops[p] / tot); } });
}
/* ---------- construcción ---------- */
function projectCost(b) { return b.cost * CP_MULT; }
function moneyPerPoint(c) { return COST_PER_POINT * diffP().cost * clamp(Math.sqrt(Math.max(1, c.stats.pop) / 12e6), 0.12, 2.5); }
function addExtra(s, p, v) { s.extra = s.extra || {}; s.extra[p] = (s.extra[p] || 0) + v; }
function canBuild(s, b, c) {
  if (b.tech && !c.techs.has(b.tech)) return false;
  return true;
}
function govConstruct(c, points, warm) {
  if (!c.queue.length || warm) return 0;
  let remaining = points, spentMoney = 0;
  for (let i = 0; i < c.queue.length && remaining > 0; i++) {
    const q = c.queue[i];
    const take = Math.min(remaining, q.cost - q.done);
    q.done += take; remaining -= take; spentMoney += take * moneyPerPoint(c);
    const s = G.S[q.state];
    const w = take * moneyPerPoint(c);
    addExtra(s, 'laborers', w * 0.65); addExtra(s, 'machinists', w * 0.1); addExtra(s, 'capitalists', w * 0.25);
  }
  for (let i = c.queue.length - 1; i >= 0; i--) {
    const q = c.queue[i];
    if (q.done >= q.cost - 1e-6) {
      const s = G.S[q.state];
      s.b[q.bld] = (s.b[q.bld] || 0) + 1;
      c.queue.splice(i, 1);
      if (c.tag === G.player) notify('build', `Se completó: ${BLD[q.bld].name} en ${s.name}.`, q.state);
    }
  }
  c.cpUsed = points - remaining;
  return spentMoney;
}

function buildRoom(s, bid) { return (s.cap[bid] || 0) - (s.b[bid] || 0) - (G.C[s.owner].queue.filter(q => q.state === s.id && q.bld === bid).length) - (G.C[s.owner].projects.filter(q => q.state === s.id && q.bld === bid).length); }

function queueBuild(c, stateId, bid) {
  const s = G.S[stateId], b = BLD[bid];
  if (!canBuild(s, b, c)) return false;
  if (s.owner !== c.tag) return false;
  if (buildRoom(s, bid) < 1) return false;
  c.queue.push({state: stateId, bld: bid, cost: projectCost(b), done: 0});
  return true;
}

function privateInvest(c, warm) {
  if (warm) { c.investPool = 0; return; }
  const share = clamp(c.mods.invest, 0, 0.6);
  c.projects.forEach(p => { p.wk--; });
  for (let i = c.projects.length - 1; i >= 0; i--) {
    const p = c.projects[i];
    if (p.wk <= 0) { const s = G.S[p.state]; s.b[p.bld] = (s.b[p.bld] || 0) + 1; c.projects.splice(i, 1); }
  }
  c.investPool = Math.min(c.investPool, 5e6);
  let guard = 0;
  while (c.investPool > 0 && guard++ < 4) {
    const cand = pickInvestment(c);
    if (!cand) { c.investPool *= 0.99; break; }
    const cost = projectCost(BLD[cand.bld]) * moneyPerPoint(c);
    if (c.investPool < cost * 1.1) break;
    c.investPool -= cost;
    c.projects.push({state: cand.state, bld: cand.bld, wk: 10 + Math.floor(rnd(0, 6))});
    const s = G.S[cand.state]; addExtra(s, 'laborers', cost * 0.7); addExtra(s, 'capitalists', cost * 0.3);
  }
}

function pickInvestment(c) {
  // el mejor VA por nivel entre edificios con hueco en algún estado del país
  let best = null, bestV = 0;
  const tries = [];
  for (let k = 0; k < 14; k++) {
    if (!c.states.length) return null;
    const s = G.S[pick(c.states)];
    const cands = BUILDINGS.filter(b => b.out && canBuild(s, b, c) && buildRoom(s, b.id) >= 1);
    if (!cands.length) continue;
    cands.forEach(b => {
      let iv = 0; for (const g in b.inputs) iv += b.inputs[g] * G.price[g];
      const va = b.outAmt * G.price[b.out] - iv;
      const un = clamp(s.unemp / Math.max(1, popTotal(s) * WF), 0, 1);
      const v = va * (0.8 + Math.random() * 0.4) * (0.55 + un) * (s.stg[b.id] > 0.6 || (b.grp === 'Agricultura') ? 1 : 0.7);
      if (v > bestV) { bestV = v; best = {state: s.id, bld: b.id}; }
    });
  }
  return bestV > VA_PER_WORKER * WORKERS_PER_LEVEL * 1.05 ? best : null;
}

/* ---------- investigación ---------- */
function techCost(c, t) { return Math.round(t.cost * (1 + 0.015 * c.techs.size) / 10) * 10; }
function eraCount(c, era) { let n = 0; c.techs.forEach(id => { if (TECH[id].era === era) n++; }); return n; }
function eraUnlocked(c, era) {
  const e = ERAS[era]; if (era === 1) return true;
  return G.date.y >= e.needYear && eraCount(c, era - 1) >= e.needPrev;
}
// estado de una tecnología para un país
function techStatus(c, t) {
  if (c.techs.has(t.id)) return {k: 'done'};
  if (t.until && G.date.y > t.until) return {k: 'obsolete', why: `Obsoleta desde ${t.until}`};
  if (t.after && G.date.y < t.after) return {k: 'year', why: `Disponible desde ${t.after}`};
  if (t.ex) { const other = TECHS.find(o => o.ex === t.ex && o.id !== t.id && c.techs.has(o.id)); if (other) return {k: 'excl', why: `Excluida por ${other.name}`}; }
  if (!eraUnlocked(c, t.era)) { const e = ERAS[t.era]; return {k: 'era', why: `Era ${t.era}: año ${e.needYear} y ${e.needPrev} tecnologías de la era anterior (${eraCount(c, t.era - 1)}/${e.needPrev})`}; }
  const miss = (t.req || []).filter(r => !c.techs.has(r));
  if (miss.length) return {k: 'req', why: 'Requiere: ' + miss.map(r => TECH[r].name).join(', ')};
  return {k: 'avail'};
}
function techAvailable(c, t) { return techStatus(c, t).k === 'avail'; }
function researchStep(c, warm) {
  if (warm) return;
  if (!c.research) {
    if (c.ai) {
      const av = TECHS.filter(t => techAvailable(c, t));
      if (av.length) {
        // la IA prefiere lo barato y lo de su especialidad; ocasionalmente elige al azar
        av.sort((a, b) => a.cost * (0.8 + Math.random() * 0.5) - b.cost * (0.8 + Math.random() * 0.5));
        c.research = av[0].id;
      }
    }
    return;
  }
  const t = TECH[c.research];
  if (techStatus(c, t).k !== 'avail') { c.research = null; return; }
  const cost = techCost(c, t);
  if (c.innovStock >= cost) {
    c.innovStock -= cost; c.techs.add(t.id); c.research = null; recalcMods(c);
    if (c.tag === G.player) notify('tech', `Has descubierto: ${t.name}.`);
  }
}
function setResearch(c, id) { if (techAvailable(c, TECH[id])) { c.research = id; return true; } return false; }

/* ---------- mensual ---------- */
function updateRanks() {
  const list = G.tags.filter(t => t !== NONE).map(t => {
    const c = G.C[t]; const st = c.stats;
    c.power = Math.pow(st.gdp / 1e5, 0.8) * 0.5 + st.soldiers / 5000 * (1 + c.mods.army) * 0.6 + st.indLevels * 0.5 + c.lit * 0.15;
    return c;
  }).sort((a, b) => b.power - a.power);
  list.forEach((c, i) => c.rank = i + 1);
  G.rankList = list.map(c => c.tag);
}

function monthlyTick(init) {
  realloc(false);
  updateRanks();
  G.tags.forEach(t => {
    const c = G.C[t];
    if (t === NONE) return;
    recalcMods(c);
    politics(c);
    if (!init) { decayBoosts(c); checkRevolution(c); } else c.gov = govName(c);
    // alfabetización
    const edu = c.mods.lit + (c.techs.has('public_schools') ? 0 : 0);
    c.lit = clamp(c.lit + (0.01 + Math.max(0, edu)) * (0.2 + c.eduFund * 0.8) / 4 * 1 + c.stats.sol * 0.0008 - 0.005, 0, 99);
    if (!init) {
      c.hist.gdp.push(Math.round(c.stats.gdp)); c.hist.pop.push(Math.round(c.stats.pop)); c.hist.treasury.push(Math.round(c.treasury)); c.hist.sol.push(+c.stats.sol.toFixed(2)); c.hist.prestige.push(Math.round(c.prestige));
      ['gdp', 'pop', 'treasury', 'sol', 'prestige'].forEach(k => { if (c.hist[k].length > 240) c.hist[k].shift(); });
    }
    c.prestige = Math.max(0, c.prestige + (c.rank <= 8 ? 0.5 : c.rank <= 20 ? 0.2 : 0.05) - 0.1);
    // IA
    if (c.ai) aiMonth(c);
    if (!init) { journal(c); traitMonth(c); if (!c.ai) achMonth(c); }
  });
  if (!init) { randomEvents(); stepColonizeAll(); diploMonth(); crisisMonth(); }
  // crecimiento de población (mensual)
  G.S.forEach(s => {
    const c = G.C[s.owner];
    const gr = grainFulfil(s);
    let ga = 0.007 + 0.00065 * (s.solAvg - 8) + (c.mods.grow || 0);
    if (gr < 0.85) ga -= (0.85 - gr) * 0.12;
    ga = clamp(ga, -0.03, 0.02);
    const g = ga / 12;
    for (const p in s.pops) s.pops[p] *= (1 + g);
  });
  if (!init && G.date.m === 0) yearly();
}
function grainFulfil(s) { const p = s.plan && s.plan.peasants; if (!p) return 1; const it = p.items[0]; return it && it.want > 0 ? Math.min(1, it.buy * G.ratio.grain / it.want) : 1; }

function realloc(fast) {
  G.S.forEach(s => {
    const c = G.C[s.owner];
    const P = popTotal(s);
    const fixed = ['aristocrats', 'capitalists', 'clergy', 'shopkeepers'];
    const shr = {aristocrats: 0.004, capitalists: 0.001 + 0.006 * c.ind, clergy: 0.008, shopkeepers: 0.006 + 0.05 * (0.04 + 0.4 * c.ind)};
    let used = 0;
    fixed.forEach(p => { const t = P * shr[p]; s.pops[p] += (t - s.pops[p]) * (fast ? 0.4 : 0.12); used += s.pops[p]; });
    const flex = ['peasants', 'laborers', 'machinists', 'soldiers', 'officers', 'bureaucrats', 'clerks'];
    const pw = P - used;
    const want = {};
    let sumD = 0;
    flex.forEach(p => { want[p] = p === 'peasants' ? 0 : (s.jobs[p] || 0) / WF * 1.03; if (p === 'clerks') want[p] += P * 0.0015; sumD += want[p]; });
    want.peasants = Math.max((s.jobs.peasants || 0) / WF * 1.03, 0);
    sumD += want.peasants;
    const scale = sumD > pw ? pw / sumD : 1;
    flex.forEach(p => want[p] *= scale);
    let rest = pw; flex.forEach(p => { if (p !== 'peasants') rest -= want[p]; });
    // el resto de la población rural es campesinado (subsistencia incluida)
    want.peasants = Math.max(want.peasants, rest);
    // normalizar para conservar población
    let tot = 0; flex.forEach(p => tot += want[p]);
    const k = pw / Math.max(tot, 1);
    flex.forEach(p => { const t = want[p] * k; s.pops[p] += (t - s.pops[p]) * (fast ? 0.5 : 0.2); });
  });
}

/* ---------- política ---------- */
function politics(c) {
  // fuerza política por estratos y leyes
  const pw = LAW[c.laws.power]; const fr = pw.fr;
  const stratM = {upper: 1, middle: clamp(fr * 2.5, 0.05, 1), lower: Math.max(0.003, fr * fr)};
  const clout = {}; IG_ORDER.forEach(k => clout[k] = 0);
  const solSum = {}, solN = {}; IG_ORDER.forEach(k => { solSum[k] = 0; solN[k] = 0; });
  c.states.forEach(id => {
    const s = G.S[id];
    for (const p in s.pops) {
      const N = s.pops[p], def = PROFS[p];
      const pol = N * ({aristocrats: 60, capitalists: 60, clergy: 15, officers: 25, bureaucrats: 10, shopkeepers: 6, clerks: 6, machinists: 5}[p] || 1) * stratM[def.strat] * profBoost(c, p);
      const w = 1 + Math.max(0, s.sol[p] - 8) * 0.04;
      for (const ig in def.ig) { clout[ig] += pol * w * def.ig[ig]; solSum[ig] += N * def.ig[ig] * s.sol[p]; solN[ig] += N * def.ig[ig]; }
    }
  });
  IG_ORDER.forEach(k => clout[k] *= boostMult(c, k));
  let tot = 0; IG_ORDER.forEach(k => tot += clout[k]);
  const igs = {};
  IG_ORDER.forEach(k => {
    const prev = c.ig[k] || {};
    const share = tot > 0 ? clout[k] / tot : 0;
    let ap = 0;
    for (const lid of Object.values(c.laws)) { const w = IGS[k].likes[lid]; if (w) ap += w; }
    const sol = solN[k] > 0 ? solSum[k] / solN[k] : 8;
    ap = ap * 0.55 + (sol - 9) * 0.25;
    c.boosts.forEach(b => { if (b.kind === 'ig' && b.key === k) ap += b.mode === 'boost' ? 1.5 : -2; });
    igs[k] = {share, sol, target: ap, approval: prev.approval === undefined ? ap : prev.approval + (ap - prev.approval) * 0.25, gov: false, support: 0};
  });
  // coalición de gobierno
  const sorted = IG_ORDER.slice().sort((a, b) => igs[b].share - igs[a].share);
  let acc = 0; sorted.forEach((k, i) => { if (acc < 0.5 || i === 0) { igs[k].gov = true; acc += igs[k].share; } });
  let L = 0;
  IG_ORDER.forEach(k => { const g = igs[k]; g.approval = clamp(g.approval, -10, 10); L += g.share * g.approval * (g.gov ? 1.6 : 0.7); });
  const targetLeg = clamp(48 + 2.2 * L + (c.mods.stab || 0) * 1.2 + c.prestige / 40, 0, 100);
  c.legitimacy += (targetLeg - c.legitimacy) * 0.2;
  let rad = 0.05, loy = 0.1;
  IG_ORDER.forEach(k => { const g = igs[k]; rad += g.share * Math.max(0, -g.approval) * 0.06; loy += g.share * Math.max(0, g.approval) * 0.05; });
  rad += (c.mods.rad || 0) * 0.08 + Math.max(0, (9 - c.stats.sol)) * 0.012;
  c.radicals += (clamp(rad, 0, 0.9) - c.radicals) * 0.25;
  c.loyalists += (clamp(loy, 0, 0.9) - c.loyalists) * 0.25;
  c.ig = igs;
  // reforma en curso
  if (c.lawChange) {
    c.lawChange.months--;
    if (c.lawChange.months <= 0) resolveLawChange(c);
  }
}

function lawSupport(c, optId) {
  // apoyo neto ponderado por influencia
  let sup = 0;
  IG_ORDER.forEach(k => { const g = c.ig[k]; const w = IGS[k].likes[optId] || 0; const cur = IGS[k].likes[c.laws[LAW[optId].cat]] || 0; sup += g.share * (w - cur); });
  return sup;
}
function startLawChange(c, optId) {
  const o = LAW[optId]; if (!o || c.laws[o.cat] === optId || c.lawChange) return {ok: false, msg: 'Ya hay una reforma en curso o la ley ya está vigente.'};
  if (o.tech && !c.techs.has(o.tech)) return {ok: false, msg: 'Requiere la tecnología: ' + TECH[o.tech].name + '.'};
  if (c.influence < 50) return {ok: false, msg: 'Necesitas 50 de influencia.'};
  c.influence -= 50;
  const sup = lawSupport(c, optId);
  const chance = clamp(0.5 + sup * 0.25 + (c.legitimacy - 50) / 250, 0.05, 0.97);
  c.lawChange = {opt: optId, months: 3, chance};
  return {ok: true};
}
function resolveLawChange(c) {
  const lc = c.lawChange; c.lawChange = null;
  const o = LAW[lc.opt];
  if (Math.random() < lc.chance) {
    c.laws[o.cat] = lc.opt; recalcMods(c); cnt(c, 'reforms');
    if (c.tag === G.player) notify('law', `Reforma aprobada: ${o.name}.`);
    c.prestige += 2;
  } else {
    c.radicals = Math.min(0.9, c.radicals + 0.04);
    c.legitimacy -= 3;
    if (c.tag === G.player) notify('law', `La reforma «${o.name}» ha sido bloqueada por la oposición.`);
  }
}

/* ---------- objetivos ---------- */
function journal(c) {
  JOURNAL.forEach(j => {
    if (c.journalDone[j.id]) return;
    if (j.prog(c) >= j.goal) {
      c.journalDone[j.id] = G.date.y;
      c.prestige += j.reward.prestige; c.innovStock += j.reward.innov;
      if (c.tag === G.player) notify('journal', `Objetivo cumplido: ${j.name} (+${j.reward.prestige} prestigio).`);
    }
  });
}

/* ---------- IA ---------- */
function aiMonth(c) {
  if (c.tag === NONE) return;
  // impuestos
  if (c.treasury < 0 && c.taxLevel < 4) c.taxLevel++;
  else if (c.treasury > 300000 + c.stats.pop * 0.05 && c.taxLevel > 1) c.taxLevel--;
  // construcción pública
  if (c.queue.length < 3 && c.treasury > 50000) {
    const burLow = c.stats.bur < c.stats.burNeed * 0.9;
    const options = [];
    if (burLow) options.push('admin');
    if (c.stats.innovRate < 8) options.push('university');
    options.push('constr', 'barracks', 'railway', 'admin');
    const bid = pick(options);
    const s = G.S[pick(c.states)];
    if (s && BLD[bid] && buildRoom(s, bid) >= 1 && canBuild(s, BLD[bid], c)) queueBuild(c, s.id, bid);
  }
  // reformas
  if (!c.lawChange && Math.random() < 0.015) {
    const cat = pick(LAW_CATS); const opts = cat.opts.filter(o => o.id !== c.laws[cat.id] && (!o.tech || c.techs.has(o.tech)));
    if (opts.length) { const o = pick(opts); if (lawSupport(c, o.id) > 0.3 && c.influence >= 50) startLawChange(c, o.id); }
  }
  // colonización
  if (c.ind > 0.25 && c.rank <= 12 && Math.random() < 0.035 && !c.colonizing) {
    const t = colonizeTargets(c);
    if (t.length) startColonize(c, t[Math.floor(Math.random() * Math.min(3, t.length))].id);
  }
}

/* ---------- colonización ---------- */
function colonizeTargets(c) {
  const out = [];
  const mine = c.states.map(id => G.S[id]);
  G.S.forEach(s => {
    if (s.owner !== NONE) return;
    let best = 1e9;
    mine.forEach(m => { const d = distStates(m, s); if (d < best) best = d; });
    // alcance: adyacente o hasta una distancia máxima por mar
    if (best < (c.ind > 0.3 ? 30 : 20) || s.neigh.some(n => G.S[n].owner === c.tag)) out.push({id: s.id, d: best});
  });
  return out.sort((a, b) => a.d - b.d);
}
function stateCenter(s) { const st = MAP.stats[s.id]; return [xToLon(st.sx / Math.max(1, st.area)), yToLat(st.sy / Math.max(1, st.area))]; }
function distStates(a, b) { const A = stateCenter(a), B = stateCenter(b); return Math.hypot(A[0] - B[0], A[1] - B[1]); }
function startColonize(c, sid) {
  if (c.colonizing || c.influence < 80) return false;
  c.influence -= 80; c.colonizing = {state: sid, months: 6};
  return true;
}
function stepColonize(c) {
  if (!c.colonizing) return;
  c.colonizing.months--;
  if (c.colonizing.months > 0) return;
  const s = G.S[c.colonizing.state]; c.colonizing = null;
  if (s.owner !== NONE) return;
  transferState(s, c.tag); cnt(c, 'colonies');
  c.prestige += 4;
  if (c.tag === G.player) notify('colony', `${s.name} ha sido incorporada a tus dominios.`, s.id);
  else logMsg(`${c.name} coloniza ${s.name}.`);
}

function transferState(s, tag) {
  const old = G.C[s.owner]; const nw = G.C[tag];
  s.occ = 0; s.occBy = null; clearProvOcc(s.id);
  if (old.tag !== NONE && !old.claims.some(x => x.state === s.id)) old.claims.push({state: s.id, perm: true});
  nw.claims = nw.claims.filter(x => x.state !== s.id);
  old.states = old.states.filter(i => i !== s.id);
  nw.states.push(s.id);
  s.owner = tag;
  s.b.admin = s.b.admin || 0;
  G.ownerOf[s.id] = nw.id;
  old.queue = old.queue.filter(q => q.state !== s.id); old.projects = old.projects.filter(q => q.state !== s.id);
  if (old.capital === s.id) old.capital = old.states[0] ?? -1;
  if (typeof onOwnershipChanged === 'function') onOwnershipChanged(s.id);
}

function crisisSeverity(c) { return clamp(1 - (c.mods.crisis || 0), 0.35, 1); }
function addCrisis(typeId, scope, extra) {
  const t = CRISIS_TYPES[typeId];
  if (G.crises.some(c => c.type === typeId && c.scope === scope)) return null;
  const months = Math.round(rnd(t.months[0], t.months[1]));
  const cr = {id: G.nextId++, type: typeId, name: t.name, icon: t.icon, scope, months, left: months, fx: Object.assign({}, t.fx), desc: t.desc, started: Object.assign({}, G.date)};

  const sc = scope === 'global' ? 'el mundo' : G.C[scope].name;

  else if (!t.hidden) logMsg(`${t.name} en ${sc}.`);
